{% extends "base.html" %}
{% block title %}소설{% endblock %}
{% block content %}
<style>
.entity-preview{min-height:72px;max-height:120px;overflow:auto;white-space:pre-wrap;background:var(--bg-input)!important;color:var(--text-secondary)!important;border-color:var(--border)!important;font-size:.9rem;line-height:1.65}.entity-mark{color:var(--text-primary);border-bottom:3px solid var(--entity-color);cursor:pointer;background:color-mix(in srgb,var(--entity-color) 16%,transparent)}.part-item.active{border-color:var(--accent)!important;background:rgba(139,127,247,.20)!important;color:var(--text-primary)!important}.novel-db-results{max-height:170px;overflow:auto;border:1px solid var(--border);border-radius:6px}.novel-db-selected{display:flex;gap:.35rem;flex-wrap:wrap;min-height:32px}.novel-db-chip{background:rgba(139,127,247,.15);color:var(--text-primary);border:1px solid rgba(139,127,247,.35)}
</style>
<div class="row g-3" style="min-height:calc(100vh - 130px)">
  <div class="col-lg-3 d-flex flex-column gap-3">
    <div class="card" style="min-height:280px"><div class="card-header d-flex justify-content-between align-items-center"><span><i class="bi bi-collection me-1"></i>이야기 / 부</span><button class="btn btn-sm btn-primary" onclick="newPart()">+</button></div><div id="parts" class="list-group list-group-flush overflow-auto" style="max-height:210px"></div></div>
    <div class="card" id="partEditor" style="display:none"><div class="card-body p-3"><label class="form-label small">이야기/부 제목</label><input id="partTitle" class="form-control form-control-sm mb-2" placeholder="예: 아르카의 이야기"><label class="form-label small">상세 설명</label><textarea id="partDescription" class="form-control form-control-sm mb-2" rows="4" placeholder="이 이야기의 주제, 시점, 범위"></textarea><label class="form-label small">챕터가 참조할 DB 정보</label><input id="partEntrySearch" class="form-control form-control-sm mb-1" placeholder="이름·분류·키워드 검색" oninput="queueNovelEntrySearch()"><div id="partEntryResults" class="novel-db-results mb-2" style="display:none"></div><div id="partEntrySelected" class="novel-db-selected mb-2"></div><div class="form-text mb-2">선택한 정보만 이 부의 LLM 생성과 보조 태깅에 전달됩니다. 선택이 없으면 DB를 전달하지 않습니다.</div><div class="d-flex gap-1 flex-wrap"><button class="btn btn-sm btn-primary" onclick="savePart()">부 저장</button><button class="btn btn-sm btn-outline-success" onclick="publishPart()"><i class="bi bi-link-45deg"></i> 부 공개 링크</button><button class="btn btn-sm btn-outline-danger ms-auto" onclick="deletePart()"><i class="bi bi-trash"></i></button></div></div></div>
    <div class="card flex-grow-1" style="min-height:300px"><div class="card-header d-flex justify-content-between align-items-center"><span><i class="bi bi-file-text me-1"></i>챕터</span><button class="btn btn-sm btn-primary" onclick="newChapter()">+</button></div><div id="chapters" class="list-group list-group-flush overflow-auto"></div></div>
  </div>
  <div class="col-lg-6"><div class="card h-100"><div class="card-header d-flex gap-2 flex-wrap"><input id="chapterTitle" class="form-control flex-grow-1" style="min-width:220px" placeholder="챕터 제목"><select id="chapterStatus" class="form-select" style="width:100px"><option>초안</option><option>공개</option></select><button class="btn btn-primary" onclick="saveChapter()">저장</button><button class="btn btn-outline-success" onclick="publishChapter()"><i class="bi bi-link-45deg"></i></button><button class="btn btn-outline-danger" onclick="deleteChapter()"><i class="bi bi-trash"></i></button></div><div class="card-body d-flex flex-column"><div id="noChapter" class="text-muted text-center my-auto">왼쪽에서 이야기/부와 챕터를 선택하세요.</div><div id="chapterEditor" class="d-flex flex-column flex-grow-1" style="display:none!important"><textarea id="chapterContent" class="form-control flex-grow-1" style="min-height:420px" placeholder="Markdown 본문" oninput="renderEntityPreview()"></textarea><div class="small text-muted mt-2">엔티티 강조 미리보기</div><div id="entityPreview" class="entity-preview border rounded p-2"></div><div class="input-group mt-2"><input id="novelInstruction" class="form-control" placeholder="이어쓰기/수정 요청"><button class="btn btn-outline-secondary" onclick="generateNovel()">LLM 제안</button></div><div id="proposal" class="mt-2"></div></div></div></div></div>
  <div class="col-lg-3"><div class="card h-100"><div class="card-header">인식된 엔티티 <label class="small float-end"><input type="checkbox" id="authorMode" checked onchange="renderEntityPreview()"> 작가 모드</label><div class="mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="llmTag()">LLM 보조 태깅</button> <button class="btn btn-sm btn-outline-primary" onclick="manualTag()">선택문구 수동 태깅</button></div></div><div id="mentions" class="card-body overflow-auto"></div></div></div>
</div>
<div class="modal fade" id="shareModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5><i class="bi bi-share me-2"></i>로그인 없는 공개 링크</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p id="shareDescription" class="small text-muted"></p><div class="input-group"><input id="shareUrl" class="form-control" readonly><button class="btn btn-outline-secondary" onclick="copyShareUrl()">복사</button></div></div><div class="modal-footer"><button class="btn btn-outline-danger me-auto" onclick="unpublishCurrentShare()">공개 중지</button><a id="openShareUrl" class="btn btn-outline-success" target="_blank" rel="noopener">새 창에서 확인</a><button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button></div></div></div></div>
{% endblock %}
{% block extra_scripts %}<script>
let partList=[],currentPart=null,chapterList=[],allChapterList=[],current=null,shareModal,shareTarget=null,proposalText='',entityProposals=[],partEntryCatalog=new Map(),entrySearchTimer=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entityColor=cat=>({'인물':'#e86a92','장소':'#4ea8de','세력':'#9b7ede','종족':'#45b69c','물건':'#e9a23b','사건':'#e76f51','연도':'#6c8ebf'}[cat]||'#7f8c8d');
async function loadParts(selectId){partList=await(await fetch('/api/novel/parts')).json();parts.innerHTML=partList.map(p=>`<button class="list-group-item list-group-item-action part-item ${currentPart?.id===p.id?'active':''}" onclick="selectPart(${p.id})"><div class="d-flex justify-content-between"><b>${esc(p.title)}</b>${p.is_public?'<i class="bi bi-globe2 text-success" title="공개 중"></i>':''}</div><small class="text-muted">${p.chapter_count}개 챕터 · DB ${(p.entry_ids||[]).length}개</small></button>`).join('');const target=selectId||currentPart?.id||partList[0]?.id;if(target&&currentPart?.id!==target)await selectPart(target,false)}
async function newPart(){const title=prompt('새 이야기/부 제목','XXX의 이야기');if(!title)return;const r=await fetch('/api/novel/parts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});const p=await r.json();if(!r.ok)return alert(p.error||'생성 실패');currentPart=null;await loadParts(p.id)}
async function selectPart(id,reloadParts=true){const r=await fetch('/api/novel/parts/'+id),p=await r.json();if(!r.ok)return;currentPart=p;partEditor.style.display='block';partTitle.value=p.title;partDescription.value=p.description||'';partEntrySearch.value='';partEntryResults.style.display='none';current=null;showChapterEditor(false);await Promise.all([loadChapters(),loadSelectedPartEntries()]);if(reloadParts)await loadParts()}
async function savePart(){if(!currentPart)return;const r=await fetch('/api/novel/parts/'+currentPart.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:partTitle.value,description:partDescription.value,entry_ids:currentPart.entry_ids||[]})});if(!r.ok)return alert((await r.json()).error||'저장 실패');currentPart=await r.json();await loadParts();alert('이야기/부와 참조 DB 목록을 저장했습니다.')}
async function loadSelectedPartEntries(){const ids=currentPart?.entry_ids||[];if(ids.length){const rows=await(await fetch('/api/novel/entry-catalog?ids='+encodeURIComponent(ids.join(',')))).json();rows.forEach(x=>partEntryCatalog.set(x.id,x))}renderPartEntrySelected()}
function renderPartEntrySelected(){const ids=currentPart?.entry_ids||[];partEntrySelected.innerHTML=ids.map(id=>{const e=partEntryCatalog.get(id);return `<button type="button" class="btn btn-sm novel-db-chip" onclick="togglePartEntry(${id})" title="선택 해제">${e?`[${esc(e.category)}] ${esc(e.title)}`:`#${id}`} ×</button>`}).join('')||'<span class="small text-muted">선택된 DB 정보가 없습니다.</span>'}
function queueNovelEntrySearch(){clearTimeout(entrySearchTimer);entrySearchTimer=setTimeout(searchNovelEntries,250)}
async function searchNovelEntries(){const q=partEntrySearch.value.trim();if(!q){partEntryResults.style.display='none';return}const rows=await(await fetch('/api/novel/entry-catalog?q='+encodeURIComponent(q))).json();rows.forEach(x=>partEntryCatalog.set(x.id,x));const selected=new Set(currentPart?.entry_ids||[]);partEntryResults.innerHTML=rows.map(e=>`<button type="button" class="list-group-item list-group-item-action py-1" onclick="togglePartEntry(${e.id})"><i class="bi ${selected.has(e.id)?'bi-check-square-fill text-success':'bi-square'} me-1"></i>[${esc(e.category)}] ${esc(e.title)}</button>`).join('')||'<div class="small text-muted p-2">검색 결과가 없습니다.</div>';partEntryResults.style.display='block'}
function togglePartEntry(id){if(!currentPart)return;const ids=new Set(currentPart.entry_ids||[]);ids.has(id)?ids.delete(id):ids.add(id);currentPart.entry_ids=[...ids];renderPartEntrySelected();if(partEntrySearch.value.trim())searchNovelEntries()}
async function deletePart(){if(!currentPart||!confirm(`'${currentPart.title}'을 삭제할까요? 소속 챕터는 다른 부로 이동합니다.`))return;const r=await fetch('/api/novel/parts/'+currentPart.id,{method:'DELETE'}),d=await r.json();if(!r.ok)return alert(d.error||'삭제 실패');currentPart=null;await loadParts(d.moved_to)}
async function loadChapters(){if(!currentPart)return;const [partRows,allRows]=await Promise.all([fetch('/api/novel/chapters?part_id='+currentPart.id).then(r=>r.json()),fetch('/api/novel/chapters').then(r=>r.json())]);chapterList=partRows;allChapterList=allRows;chapters.innerHTML=chapterList.map(c=>`<button draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${c.id}')" ondragover="event.preventDefault()" ondrop="reorder(event,${c.id})" class="list-group-item list-group-item-action ${current?.id===c.id?'active':''}" onclick="selectChapter(${c.id})">${c.order_no}. ${esc(c.title)}<span class="badge ${c.is_public?'bg-success':'bg-secondary'} float-end">${c.is_public?'링크 공개':c.status}</span></button>`).join('')||'<div class="small text-muted p-3">이 부에는 챕터가 없습니다.</div>'}
async function newChapter(){if(!currentPart)return alert('먼저 이야기/부를 선택하세요.');const r=await fetch('/api/novel/chapters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'새 챕터',part_id:currentPart.id})});const c=await r.json();await loadChapters();selectChapter(c.id)}
async function selectChapter(id){const r=await fetch('/api/novel/chapters/'+id);current=await r.json();if(!r.ok)return alert(current.error||'챕터 조회 실패');chapterTitle.value=current.title;chapterContent.value=current.content;chapterStatus.value=current.status;showChapterEditor(true);renderMentions();renderEntityPreview();loadChapters()}
function showChapterEditor(show){noChapter.style.display=show?'none':'block';chapterEditor.style.setProperty('display',show?'flex':'none','important')}
async function saveChapter(){if(!current)return;const r=await fetch('/api/novel/chapters/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:chapterTitle.value,content:chapterContent.value,status:chapterStatus.value,part_id:currentPart.id})});const d=await r.json();if(!r.ok)return alert(d.error||'저장 실패');current=d;renderMentions();renderEntityPreview();await loadChapters()}
async function deleteChapter(){if(!current||!confirm(`'${current.title}' 챕터를 삭제할까요?`))return;const r=await fetch('/api/novel/chapters/'+current.id,{method:'DELETE'});if(!r.ok)return alert('삭제 실패');current=null;showChapterEditor(false);mentions.innerHTML='';await loadChapters()}
function renderMentions(){mentions.innerHTML=(current?.mentions||[]).map(m=>`<button class="btn btn-sm btn-outline-secondary w-100 text-start mb-1" style="border-left:4px solid ${entityColor(m.category)}" onclick="showEntity(${m.entry_id})"><b>${esc(m.entry_title||m.matched_text)}</b> <small>${esc(m.category)} · ${m.source}</small></button>`).join('')||'<span class="text-muted">저장하면 제목·별칭을 자동 인식합니다.</span>'}
function renderEntityPreview(){if(!current)return;const text=chapterContent.value||'',rows=[...(current?.mentions||[])].sort((a,b)=>a.span_start-b.span_start||b.span_end-a.span_end);let pos=0,html='';for(const m of rows){if(m.span_start<pos||m.span_start<0||m.span_end>text.length)continue;html+=esc(text.slice(pos,m.span_start));html+=`<span class="entity-mark" style="--entity-color:${entityColor(m.category)}" title="[${esc(m.category)}] ${esc(m.entry_title)}" onclick="showEntity(${m.entry_id})">${esc(text.slice(m.span_start,m.span_end))}</span>`;pos=m.span_end}html+=esc(text.slice(pos));entityPreview.innerHTML=html||'<span class="text-muted">본문을 저장하면 엔티티가 강조됩니다.</span>'}
function fieldVisible(states,path){if(authorMode.checked)return true;const state=states.find(x=>x.field_path===path)||states.find(x=>path.startsWith(x.field_path+'.'));if(!state||state.visibility==='완전공개')return true;if(state.visibility==='작가전용')return false;const reveal=allChapterList.find(c=>c.id===state.reveal_chapter_id);if(!reveal||!current)return false;const rp=partList.find(p=>p.id===reveal.part_id),cp=partList.find(p=>p.id===current.part_id),rpo=rp?.order_no||0,cpo=cp?.order_no||0;return rpo<cpo||(rpo===cpo&&(reveal.order_no<current.order_no||(reveal.order_no===current.order_no&&reveal.id<=current.id)))}
async function showEntity(id){const [e,states,stat]=await Promise.all([fetch('/api/entries/'+id).then(r=>r.json()),fetch(`/api/entries/${id}/reveal`).then(r=>r.json()),fetch(`/api/entries/${id}/stat-block`).then(r=>r.json())]);const contentVisible=fieldVisible(states,'content');const attrs=(stat.attributes||[]).filter(a=>fieldVisible(states,'stat_block.'+a.axis_name));const skills=fieldVisible(states,'stat_block.skills')?(stat.skills||[]):[];const statHtml=`<div class="mb-2">${attrs.map(a=>`<span class="badge bg-secondary me-1">${esc(a.axis_name)} ${a.value}${a.label?' · '+esc(a.label):''}</span>`).join('')}</div><div>${skills.map(x=>`<span class="badge text-bg-info me-1">${esc(x.skill.name)}${x.rank?' '+x.rank:''}</span>`).join('')}</div>`;mentions.innerHTML=`<button class="btn btn-sm btn-outline-secondary mb-2" onclick="renderMentions()">← 목록</button><h6>[${esc(e.category)}] ${esc(e.title)}</h6>${statHtml}<div class="small markdown-body">${contentVisible?markdownHtml(e.content.slice(0,1200)):'<span class="text-warning">이 정보는 현재 챕터에서 공개되지 않았습니다.</span>'}</div><a href="/graph?entry=${e.id}" class="btn btn-sm btn-outline-primary mt-2">관계도에서 보기</a>`}
async function generateNovel(){if(!current)return alert('챕터를 선택하세요.');const r=await fetch('/api/novel/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapter_id:current.id,instruction:novelInstruction.value})});const d=await r.json();if(!r.ok)return alert(d.error);proposalText=d.proposal;entityProposals=d.new_entity_proposals||[];proposal.innerHTML=`<div class="alert alert-info markdown-body" style="max-height:220px;overflow:auto">${markdownHtml(proposalText)}</div><button class="btn btn-sm btn-primary" onclick="applyProposal()">본문에 적용</button>${entityProposals.length?` <button class="btn btn-sm btn-outline-warning" onclick="approveEntities()">신규 고유명사 ${entityProposals.length}개 검토·등록</button>`:''}`}
function applyProposal(){chapterContent.value=proposalText;proposal.innerHTML='';renderEntityPreview()}
async function approveEntities(){if(!confirm(entityProposals.map(x=>`[${x.category}] ${x.title}`).join('\n')+'\n\n새 엔트리로 등록할까요?'))return;for(const x of entityProposals)await fetch('/api/entries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:x.title,category:x.category,content:x.content})});entityProposals=[];alert('승인한 엔트리를 등록했습니다.')}
async function llmTag(){if(!current)return;const r=await fetch(`/api/novel/chapters/${current.id}/mention-proposals`,{method:'POST'});const d=await r.json();if(!r.ok)return alert(d.error);const list=d.mentions||[];if(!list.length)return alert('추가 후보가 없습니다.');if(!confirm(list.map(x=>`${x.matched_text} → 엔트리 #${x.entry_id}`).join('\n')+'\n\n승인할까요?'))return;for(const x of list)await fetch(`/api/novel/chapters/${current.id}/mentions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,source:'llm'})});selectChapter(current.id)}
async function manualTag(){if(!current)return alert('챕터를 선택하세요.');const start=chapterContent.selectionStart,end=chapterContent.selectionEnd,text=chapterContent.value.slice(start,end);if(!text)return alert('본문에서 태깅할 문구를 먼저 선택하세요.');if(chapterContent.value!==current.content)await saveChapter();const ids=currentPart?.entry_ids||[];if(!ids.length)return alert('먼저 이야기/부에서 참조할 DB 정보를 선택하고 저장하세요.');const entryList=await(await fetch('/api/novel/entry-catalog?ids='+encodeURIComponent(ids.join(',')))).json(),hint=entryList.map(e=>`${e.id}: [${e.category}] ${e.title}`).join('\n'),entryId=+(prompt(`'${text}'에 연결할 엔트리 ID\n${hint}`)||0);if(!entryId)return;const r=await fetch(`/api/novel/chapters/${current.id}/mentions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entry_id:entryId,matched_text:text,span_start:start,span_end:end,source:'manual'})});if(!r.ok)return alert((await r.json()).error||'태깅 실패');selectChapter(current.id)}
async function reorder(ev,target){const source=+ev.dataTransfer.getData('text/plain'),a=chapterList.find(x=>x.id===source),b=chapterList.find(x=>x.id===target);if(!a||!b)return;const n=a.order_no;a.order_no=b.order_no;b.order_no=n;await Promise.all([a,b].map(x=>fetch('/api/novel/chapters/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_no:x.order_no})})));loadChapters()}
async function publishPart(){if(!currentPart)return;if(!currentPart.is_public&&!confirm('이 부의 모든 챕터를 로그인 없이 볼 수 있는 링크로 공개할까요?'))return;await openShare('part',currentPart.id,currentPart.title,currentPart.is_public)}
async function publishChapter(){if(!current)return;if(!current.is_public&&!confirm('현재 챕터를 로그인 없이 볼 수 있는 링크로 공개할까요?'))return;await openShare('chapter',current.id,current.title,current.is_public)}
async function openShare(kind,id,title,alreadyPublic){const r=await fetch(`/api/novel/${kind==='part'?'parts':'chapters'}/${id}/publish`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public:true})}),d=await r.json();if(!r.ok)return alert(d.error||'공개 실패');shareTarget={kind,id};shareUrl.value=d.url;openShareUrl.href=d.url;shareDescription.textContent=`${kind==='part'?'부 전체':'챕터'} '${title}' 공개 링크입니다. 이 링크는 로그인 없이 열립니다.`;shareModal=shareModal||new bootstrap.Modal(document.getElementById('shareModal'));shareModal.show();if(kind==='part'){currentPart.is_public=true;loadParts()}else{current.is_public=true;loadChapters()}}
async function unpublishCurrentShare(){if(!shareTarget||!confirm('이 공개 링크를 비활성화할까요?'))return;const {kind,id}=shareTarget,r=await fetch(`/api/novel/${kind==='part'?'parts':'chapters'}/${id}/publish`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({public:false})});if(!r.ok)return alert('공개 중지 실패');shareModal.hide();if(kind==='part'){currentPart.is_public=false;loadParts()}else{current.is_public=false;loadChapters()}}
async function copyShareUrl(){try{await navigator.clipboard.writeText(shareUrl.value);alert('링크를 복사했습니다.')}catch(e){shareUrl.select();document.execCommand('copy')}}
loadParts();
</script>{% endblock %}
