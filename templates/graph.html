{% extends "base.html" %}
{% block title %}관계도{% endblock %}

{% block content %}
<!-- vis.js Network CDN -->
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

<style>
  #graphWrap {
    display: flex;
    gap: 1rem;
    height: calc(100vh - 130px);
  }
  #networkCanvas {
    flex: 1;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    overflow: hidden;
    position: relative;
  }
  #networkCanvas .empty-hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-secondary);
    text-align: center;
    pointer-events: none;
  }
  #sidePanel {
    width: 360px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    overflow-y: auto;
  }
  /* 그래프 컨트롤 바 */
  #graphControls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }
  /* 범례 */
  .legend-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 4px;
  }
  /* 편집 토글 */
  #viewBlock, #editBlock { transition: opacity 0.15s; }
  /* 노드 선택 강조 */
  .node-selected { box-shadow: 0 0 0 2px var(--accent); }
</style>

<!-- 상단 컨트롤 -->
<div id="graphControls">
  <span style="font-weight:600; font-size:0.9rem;"><i class="bi bi-diagram-3 me-1"></i>엔트리 관계도</span>
  <div class="d-flex gap-1 ms-2 flex-wrap" id="legendBar">
    <!-- JS로 채움 -->
  </div>
  <div class="ms-auto d-flex gap-2 align-items-center flex-wrap">
    <div class="form-check form-switch mb-0 d-flex align-items-center gap-1">
      <input class="form-check-input" type="checkbox" id="showInactiveGraph" onchange="reloadGraph()">
      <label class="form-check-label small" for="showInactiveGraph">비활성 포함</label>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="network && network.fit()">
      <i class="bi bi-fullscreen me-1"></i>전체 보기
    </button>
    <button class="btn btn-sm btn-outline-secondary" onclick="reloadGraph()">
      <i class="bi bi-arrow-clockwise me-1"></i>새로고침
    </button>
  </div>
</div>

<div id="graphWrap">
  <!-- 그래프 캔버스 -->
  <div id="networkCanvas">
    <div class="empty-hint" id="emptyHint" style="display:none;">
      <i class="bi bi-diagram-3 display-4 opacity-25 d-block mb-2"></i>
      <p class="small">등록된 엔트리가 없습니다.</p>
    </div>
  </div>

  <!-- 사이드 패널 -->
  <div id="sidePanel">
    <!-- 선택 전 안내 -->
    <div class="card" id="sideEmpty">
      <div class="card-body text-center py-5" style="color:var(--text-secondary);">
        <i class="bi bi-cursor display-4 opacity-25 d-block mb-3"></i>
        <p class="small">그래프에서 노드를 클릭하면<br>상세 정보가 여기에 표시됩니다.</p>
      </div>
    </div>

    <!-- 상세/편집 카드 -->
    <div class="card" id="sideDetail" style="display:none;">
      <div class="card-header py-3 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <span id="sdCategoryBadge"></span>
          <span id="sdTitle" class="fw-bold" style="font-size:0.95rem;"></span>
        </div>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-secondary" id="editToggleBtn" onclick="toggleEditMode()">
            <i class="bi bi-pencil me-1"></i>편집
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteFromGraph()">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-3">

        <!-- 뷰 모드 -->
        <div id="viewBlock">
          <div class="mb-3">
            <div class="small text-muted mb-1">내용</div>
            <div id="sdContent" style="white-space:pre-wrap; font-size:0.875rem; line-height:1.7;"></div>
          </div>
          <div class="mb-2">
            <div class="small text-muted mb-1">참조 엔트리</div>
            <div id="sdRefs" class="d-flex flex-wrap gap-1"></div>
          </div>
          <hr style="border-color:var(--border);">
          <div class="row g-2" style="font-size:0.8rem; color:var(--text-secondary);">
            <div class="col-6"><span class="text-muted">생성 틱</span><br><span id="sdTick"></span></div>
            <div class="col-6"><span class="text-muted">상태</span><br><span id="sdStatus"></span></div>
            <div class="col-12 mt-1"><span class="text-muted">등록일</span><br><span id="sdCreatedAt"></span></div>
          </div>
        </div>

        <!-- 편집 모드 -->
        <div id="editBlock" style="display:none;">
          <div class="mb-3">
            <label class="form-label small">제목</label>
            <input type="text" class="form-control form-control-sm" id="sdEditTitle">
          </div>
          <div class="mb-3">
            <label class="form-label small">분류</label>
            <select class="form-select form-select-sm" id="sdEditCategory">
              {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <label class="form-label small mb-0">내용</label>
              <button type="button" class="btn btn-outline-secondary" style="font-size:0.7rem;padding:1px 6px;"
                onclick="stripMdSide()"><i class="bi bi-eraser me-1"></i>MD 제거</button>
            </div>
            <textarea class="form-control form-control-sm" id="sdEditContent" rows="8"
              oninput="updateSideCharCount()"></textarea>
            <div id="sdCharCount" class="small mt-1" style="color:var(--text-secondary);"></div>
          </div>
          <div class="mb-3">
            <label class="form-label small">참조 ID (콤마로 구분)</label>
            <input type="text" class="form-control form-control-sm" id="sdEditRefs" placeholder="예: 1, 3, 7">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="sdEditActive">
            <label class="form-check-label small" for="sdEditActive">활성 상태</label>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary" onclick="saveFromGraph()">
              <i class="bi bi-check-lg me-1"></i>저장
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="cancelEditMode()">취소</button>
          </div>
        </div>

      </div>
    </div>

    <!-- 연결된 노드 목록 -->
    <div class="card" id="sideConnected" style="display:none;">
      <div class="card-header py-2" style="font-size:0.85rem;">
        <i class="bi bi-link-45deg me-1"></i>연결된 엔트리
      </div>
      <div class="card-body p-2" id="connectedList"></div>
    </div>
  </div>
</div>

<script>
// ── 카테고리 색상 ────────────────────────────────
const CAT_COLORS = {
  '세력': { bg: '#3b6fd4', border: '#5a8fee', font: '#e8f0ff' },
  '인물': { bg: '#7c4dbb', border: '#a070d4', font: '#f0e8ff' },
  '관념': { bg: '#2a8a6e', border: '#40b890', font: '#e0fff5' },
  '물건': { bg: '#b86a1e', border: '#de8a40', font: '#fff3e0' },
  '종족': { bg: '#1e7aa0', border: '#3aa0cc', font: '#e0f4ff' },
  '사건': { bg: '#c0392b', border: '#e05040', font: '#ffe8e5' },
};
const DEFAULT_COLOR = { bg: '#4a5568', border: '#718096', font: '#edf2f7' };

let network = null;
let allEntries = [];
let selectedEntry = null;
let simMaxChars = 1000;
let isEditMode = false;

// ── 초기화 ───────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  buildLegend();
  await loadSimMaxChars();
  await reloadGraph();
});

async function loadSimMaxChars() {
  try {
    const res = await fetch('/api/settings');
    const s = await res.json();
    simMaxChars = s.max_user_entry_chars ?? 1000;
  } catch (e) {}
}

function buildLegend() {
  const bar = document.getElementById('legendBar');
  bar.innerHTML = Object.entries(CAT_COLORS).map(([name, c]) =>
    `<span class="small" style="display:inline-flex;align-items:center;margin-right:6px;">
      <span class="legend-dot" style="background:${c.bg};border:2px solid ${c.border};"></span>${name}
    </span>`
  ).join('');
}

// ── 그래프 로드 ──────────────────────────────────
async function reloadGraph() {
  const showInactive = document.getElementById('showInactiveGraph').checked;
  const res = await fetch(`/api/entries?active=${!showInactive}`);
  allEntries = await res.json();

  if (allEntries.length === 0) {
    document.getElementById('emptyHint').style.display = 'block';
  } else {
    document.getElementById('emptyHint').style.display = 'none';
  }

  buildGraph(allEntries);
}

function buildGraph(entries) {
  const container = document.getElementById('networkCanvas');

  // 노드 생성
  const nodes = entries.map(e => {
    const c = CAT_COLORS[e.category] || DEFAULT_COLOR;
    const inactive = !e.is_active;
    return {
      id: e.id,
      label: e.title.length > 14 ? e.title.slice(0, 13) + '…' : e.title,
      title: `[${e.category}] ${e.title}`,   // hover tooltip
      color: {
        background: inactive ? '#3a3a4a' : c.bg,
        border: inactive ? '#555' : c.border,
        highlight: { background: c.bg, border: '#fff' },
        hover: { background: c.bg, border: '#fff' },
      },
      font: { color: inactive ? '#888' : c.font, size: 13 },
      shape: shapeFor(e.category),
      size: 22,
      opacity: inactive ? 0.5 : 1.0,
      _data: e,
    };
  });

  // 엣지 생성 (참조 관계)
  const edgeSet = new Set();
  const edges = [];
  const idSet = new Set(entries.map(e => e.id));
  entries.forEach(e => {
    (e.references || []).forEach(refId => {
      if (!idSet.has(refId)) return;
      const key = [Math.min(e.id, refId), Math.max(e.id, refId)].join('-');
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edges.push({
          from: e.id, to: refId,
          color: { color: 'rgba(140,150,180,0.45)', highlight: 'rgba(200,210,255,0.9)' },
          width: 1.5,
          smooth: { type: 'continuous' },
        });
      }
    });
  });

  const data = {
    nodes: new vis.DataSet(nodes),
    edges: new vis.DataSet(edges),
  };

  const options = {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, springLength: 130, springConstant: 0.06 },
      stabilization: { iterations: 150 },
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      zoomView: true,
      dragView: true,
    },
    layout: { improvedLayout: true },
  };

  if (network) network.destroy();
  network = new vis.Network(container, data, options);

  network.on('click', params => {
    if (params.nodes.length > 0) {
      const nodeId = params.nodes[0];
      const entry = entries.find(e => e.id === nodeId);
      if (entry) showSidePanel(entry);
    } else {
      clearSidePanel();
    }
  });

  // 선택된 엔트리 유지
  if (selectedEntry) {
    const still = entries.find(e => e.id === selectedEntry.id);
    if (still) showSidePanel(still);
  }
}

function shapeFor(cat) {
  const map = { '세력': 'diamond', '인물': 'ellipse', '관념': 'hexagon', '물건': 'box', '종족': 'triangle', '사건': 'star' };
  return map[cat] || 'ellipse';
}

// ── 사이드 패널 ───────────────────────────────────
function showSidePanel(entry) {
  selectedEntry = entry;
  isEditMode = false;

  document.getElementById('sideEmpty').style.display = 'none';
  document.getElementById('sideDetail').style.display = 'block';

  const c = CAT_COLORS[entry.category] || DEFAULT_COLOR;
  document.getElementById('sdCategoryBadge').innerHTML =
    `<span class="badge" style="background:${c.bg};color:${c.font};font-size:0.75rem;">${entry.category}</span>`;
  document.getElementById('sdTitle').textContent = entry.title;
  document.getElementById('sdContent').textContent = entry.content;
  document.getElementById('sdTick').textContent = entry.created_at_tick != null ? `Tick ${entry.created_at_tick}` : '수동 입력';
  document.getElementById('sdStatus').innerHTML = entry.is_active
    ? '<span class="badge bg-success">활성</span>'
    : '<span class="badge bg-secondary">비활성</span>';
  document.getElementById('sdCreatedAt').textContent = entry.created_at || '';

  // 참조 배지
  const refsDiv = document.getElementById('sdRefs');
  if (entry.references && entry.references.length > 0) {
    refsDiv.innerHTML = entry.references.map(refId => {
      const ref = allEntries.find(e => e.id === refId);
      const label = ref ? ref.title : `#${refId}`;
      const rc = ref ? (CAT_COLORS[ref.category] || DEFAULT_COLOR) : DEFAULT_COLOR;
      return `<span class="badge" style="background:${rc.bg};color:${rc.font};cursor:pointer;"
        onclick="jumpToNode(${refId})">${label}</span>`;
    }).join('');
  } else {
    refsDiv.innerHTML = '<span class="small text-muted">없음</span>';
  }

  // 연결된 노드 (역방향 포함)
  showConnected(entry.id);

  // 뷰모드로 리셋
  showViewMode();

  // 그래프에서 해당 노드 선택 표시
  network && network.selectNodes([entry.id], false);
  network && network.focus(entry.id, { scale: 1.2, animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
}

function showConnected(entryId) {
  const connected = allEntries.filter(e =>
    (e.references || []).includes(entryId) || ((selectedEntry?.references || []).includes(e.id))
  ).filter(e => e.id !== entryId);

  const card = document.getElementById('sideConnected');
  const list = document.getElementById('connectedList');

  if (connected.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  list.innerHTML = connected.map(e => {
    const c = CAT_COLORS[e.category] || DEFAULT_COLOR;
    return `<div class="d-flex align-items-center gap-2 py-1 px-1 rounded mb-1"
        style="cursor:pointer; transition:background 0.15s;"
        onmouseover="this.style.background='rgba(255,255,255,0.05)'"
        onmouseout="this.style.background=''"
        onclick="jumpToNode(${e.id})">
      <span class="badge" style="background:${c.bg};color:${c.font};font-size:0.7rem;flex-shrink:0;">${e.category}</span>
      <span style="font-size:0.85rem;">${e.title}</span>
    </div>`;
  }).join('');
}

function clearSidePanel() {
  selectedEntry = null;
  document.getElementById('sideEmpty').style.display = 'block';
  document.getElementById('sideDetail').style.display = 'none';
  document.getElementById('sideConnected').style.display = 'none';
}

function jumpToNode(id) {
  const entry = allEntries.find(e => e.id === id);
  if (!entry) return;
  showSidePanel(entry);
}

// ── 편집 모드 ─────────────────────────────────────
function toggleEditMode() {
  isEditMode ? cancelEditMode() : startEditMode();
}

function startEditMode() {
  isEditMode = true;
  const e = selectedEntry;
  document.getElementById('sdEditTitle').value = e.title;
  document.getElementById('sdEditCategory').value = e.category;
  document.getElementById('sdEditContent').value = e.content;
  document.getElementById('sdEditRefs').value = (e.references || []).join(', ');
  document.getElementById('sdEditActive').checked = e.is_active;
  showEditMode();
  updateSideCharCount();
}

function cancelEditMode() {
  isEditMode = false;
  showViewMode();
}

function showViewMode() {
  document.getElementById('viewBlock').style.display = 'block';
  document.getElementById('editBlock').style.display = 'none';
  document.getElementById('editToggleBtn').innerHTML = '<i class="bi bi-pencil me-1"></i>편집';
}

function showEditMode() {
  document.getElementById('viewBlock').style.display = 'none';
  document.getElementById('editBlock').style.display = 'block';
  document.getElementById('editToggleBtn').innerHTML = '<i class="bi bi-x me-1"></i>취소';
}

async function saveFromGraph() {
  if (!selectedEntry) return;
  const refs = document.getElementById('sdEditRefs').value
    .split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const body = {
    title: document.getElementById('sdEditTitle').value.trim(),
    category: document.getElementById('sdEditCategory').value,
    content: document.getElementById('sdEditContent').value.trim(),
    references: refs,
    is_active: document.getElementById('sdEditActive').checked,
  };
  if (!body.title || !body.content) { alert('제목과 내용을 입력하세요.'); return; }
  const res = await fetch(`/api/entries/${selectedEntry.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (res.ok) {
    await reloadGraph();
  } else {
    alert('저장 실패');
  }
}

async function deleteFromGraph() {
  if (!selectedEntry) return;
  if (!confirm(`"${selectedEntry.title}" 엔트리를 삭제하시겠습니까?`)) return;
  const res = await fetch(`/api/entries/${selectedEntry.id}`, { method: 'DELETE' });
  if (res.ok) {
    selectedEntry = null;
    clearSidePanel();
    await reloadGraph();
  }
}

// ── 글자수 카운터 ──────────────────────────────────
function updateSideCharCount() {
  const ta = document.getElementById('sdEditContent');
  const counter = document.getElementById('sdCharCount');
  const len = ta.value.length;
  if (simMaxChars > 0) {
    const over = len - simMaxChars;
    if (over > 0) {
      counter.innerHTML = `<span style="color:#f59e0b">${len}자</span> / 제한: ${simMaxChars}자 &nbsp;<span style="color:#f59e0b">⚠ ${over}자 초과</span>`;
    } else {
      counter.textContent = `${len}자 / 제한: ${simMaxChars}자`;
    }
  } else {
    counter.textContent = `${len}자 (제한 없음)`;
  }
}

// ── MD 제거 (사이드 패널) ──────────────────────────
function stripMarkdown(text) {
  return text
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*\*(.+?)\*\*\*/g, '$1').replace(/___(.+?)___/g, '$1')
    .replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1')
    .replace(/\*(.+?)\*/g, '$1').replace(/_(.+?)_/g, '$1')
    .replace(/~~(.+?)~~/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
    .replace(/^>\s*/gm, '')
    .replace(/^(\s*[-*_]){3,}\s*$/gm, '')
    .replace(/^[\s]*[-*+]\s+/gm, '')
    .replace(/^[\s]*\d+\.\s+/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function stripMdSide() {
  const ta = document.getElementById('sdEditContent');
  ta.value = stripMarkdown(ta.value);
  updateSideCharCount();
}
</script>
{% endblock %}
