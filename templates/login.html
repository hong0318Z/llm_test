<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldLLM 로그인</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-dark text-light"><main class="container" style="max-width:430px;margin-top:12vh"><h2 class="mb-4">WorldLLM 로그인</h2>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}<form method="post"><input class="form-control mb-2" name="username" placeholder="아이디" required autofocus><input class="form-control mb-3" type="password" name="password" placeholder="비밀번호" required><button class="btn btn-primary w-100">로그인</button></form><a class="d-block mt-3 text-center" href="/register">회원가입 요청</a></main></body></html>
