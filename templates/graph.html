{% extends "base.html" %}
{% block title %}관계도{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

<style>
  #graphWrap {
    display: flex;
    gap: 1rem;
    height: calc(100vh - 128px);
  }
  #networkCanvas {
    flex: 1;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #0d1018;
    overflow: hidden;
    position: relative;
  }
  #emptyHint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-muted); text-align: center; pointer-events: none;
  }
  #sidePanel {
    width: 340px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 0.75rem;
    overflow-y: auto;
  }
  /* 컨트롤 바 */
  #graphControls {
    display: flex; align-items: center; gap: 0.6rem;
    flex-wrap: wrap; margin-bottom: 0.75rem;
  }
  /* 범례 */
  .legend-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    font-size: 0.73rem; border: 1px solid; font-weight: 500;
    cursor: pointer; transition: opacity 0.15s;
    user-select: none;
  }
  .legend-pill.muted { opacity: 0.35; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* 사이드 패널 카드 */
  .side-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .side-card-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .side-card-body { padding: 14px 16px; }
  .meta-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .meta-label { font-size: 0.72rem; color: var(--text-muted); }
  .meta-val   { font-size: 0.82rem; color: var(--text-secondary); }

  /* 연결 노드 아이템 */
  .connected-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 8px;
    cursor: pointer; transition: background 0.12s;
  }
  .connected-item:hover { background: rgba(255,255,255,0.05); }

  /* 편집 폼 */
  .form-control, .form-select {
    background: var(--bg-input) !important; border-color: var(--border) !important;
    color: var(--text-primary) !important; font-size: 0.85rem;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px rgba(139,127,247,0.2) !important;
  }

  /* 선택 노드 강조 링 → vis.js의 highlight 색으로 처리 */
</style>

<!-- 컨트롤 바 -->
<div id="graphControls">
  <span style="font-weight:600; font-size:0.88rem; color:var(--text-primary);">
    <i class="bi bi-diagram-3 me-1" style="color:var(--accent);"></i>엔트리 관계도
  </span>
  <div id="legendBar" class="d-flex flex-wrap gap-1 ms-2"></div>
  <div class="ms-auto d-flex gap-2 align-items-center">
    <div class="form-check form-switch mb-0 d-flex align-items-center gap-1">
      <input class="form-check-input" type="checkbox" id="showInactiveGraph" onchange="reloadGraph()">
      <label class="form-check-label small" for="showInactiveGraph" style="font-size:0.78rem;">비활성 포함</label>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="network && network.fit({ animation: { duration:400, easingFunction:'easeInOutQuad' } })">
      <i class="bi bi-fullscreen"></i>
    </button>
    <button class="btn btn-sm btn-outline-secondary" onclick="reloadGraph()">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>
</div>

<div id="graphWrap">
  <!-- 캔버스 -->
  <div id="networkCanvas">
    <div id="emptyHint" style="display:none;">
      <i class="bi bi-diagram-3 display-4 opacity-25 d-block mb-2"></i>
      <p class="small">등록된 엔트리가 없습니다.</p>
    </div>
  </div>

  <!-- 사이드 패널 -->
  <div id="sidePanel">

    <!-- 빈 상태 안내 -->
    <div class="side-card" id="sideEmpty">
      <div class="side-card-body text-center py-5" style="color:var(--text-muted);">
        <i class="bi bi-cursor display-4 opacity-20 d-block mb-3"></i>
        <p class="small mb-0">노드를 클릭하면<br>상세 정보가 표시됩니다.</p>
      </div>
    </div>

    <!-- 상세 카드 -->
    <div class="side-card" id="sideDetail" style="display:none;">
      <div class="side-card-header">
        <span id="sdCategoryBadge"></span>
        <span id="sdTitle" class="fw-semibold" style="font-size:0.9rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
        <div class="d-flex gap-1 ms-2">
          <button class="btn btn-sm" id="editToggleBtn" onclick="toggleEditMode()"
            style="padding:3px 8px;font-size:0.75rem;border:1px solid var(--border);color:var(--text-secondary);">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm" onclick="deleteFromGraph()"
            style="padding:3px 8px;font-size:0.75rem;border:1px solid rgba(255,112,112,0.3);color:#ff7070;">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div class="side-card-body">
        <!-- 뷰 모드 -->
        <div id="viewBlock">
          <!-- 이미지 영역 -->
          <div id="sdImageArea" class="mb-3"></div>

          <div class="mb-3">
            <div class="meta-label mb-1">내용</div>
            <div id="sdContent" style="white-space:pre-wrap;font-size:0.84rem;line-height:1.7;color:var(--text-secondary);max-height:200px;overflow-y:auto;"></div>
          </div>
          <div class="mb-3">
            <div class="meta-label mb-1">키워드</div>
            <div id="sdKeywords"></div>
          </div>
          <div class="mb-3">
            <div class="meta-label mb-1">참조 엔트리</div>
            <div id="sdRefs" class="d-flex flex-wrap gap-1"></div>
          </div>
          <hr style="border-color:var(--border); margin:10px 0;">
          <div class="d-flex gap-3 flex-wrap" style="font-size:0.78rem;">
            <div><span class="meta-label">생성 틱</span><br><span id="sdTick" class="meta-val"></span></div>
            <div><span class="meta-label">상태</span><br><span id="sdStatus"></span></div>
            <div><span class="meta-label">등록일</span><br><span id="sdCreatedAt" class="meta-val"></span></div>
          </div>
        </div>

        <!-- 편집 모드 -->
        <div id="editBlock" style="display:none;">
          <div class="mb-3">
            <label class="form-label" style="font-size:0.78rem;">제목</label>
            <input type="text" class="form-control form-control-sm" id="sdEditTitle">
          </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:0.78rem;">분류</label>
            <select class="form-select form-select-sm" id="sdEditCategory">
              {% for cat in categories %}
              <option value="{{ cat }}">{{ cat }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-1">
              <label class="form-label mb-0" style="font-size:0.78rem;">내용</label>
              <button type="button" onclick="stripMdSide()"
                style="background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:4px;padding:1px 6px;font-size:0.7rem;cursor:pointer;">
                <i class="bi bi-eraser"></i> MD 제거</button>
            </div>
            <textarea class="form-control form-control-sm" id="sdEditContent" rows="8"
              oninput="updateSideCharCount()"></textarea>
            <div id="sdCharCount" class="small mt-1" style="color:var(--text-muted); font-size:0.72rem;"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" style="font-size:0.78rem;">참조 ID (콤마 구분)</label>
            <input type="text" class="form-control form-control-sm" id="sdEditRefs" placeholder="예: 1, 3, 7">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="sdEditActive">
            <label class="form-check-label" style="font-size:0.78rem;" for="sdEditActive">활성 상태</label>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary" onclick="saveFromGraph()" style="font-size:0.8rem;">
              <i class="bi bi-check-lg me-1"></i>저장
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="cancelEditMode()" style="font-size:0.8rem;">취소</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 연결 엔트리 -->
    <div class="side-card" id="sideConnected" style="display:none;">
      <div class="side-card-header" style="padding:10px 16px;">
        <i class="bi bi-share me-1" style="color:var(--accent); font-size:0.85rem;"></i>
        <span style="font-size:0.8rem; font-weight:500;">연결된 엔트리</span>
        <span id="connectedCount" class="ms-auto badge" style="background:rgba(139,127,247,0.2);color:var(--accent);font-size:0.7rem;"></span>
      </div>
      <div class="side-card-body p-2" id="connectedList"></div>
    </div>

  </div>
</div>

<script>
// ── 팔레트 ─────────────────────────────────────────────────
// 조용하고 세련된 색상 (배경 어두운 tone-on-tone)
const PALETTE = {
  '세력': { node: '#e05252', border: '#ff8080', glow: '#ff404044', font: '#fff0f0' },
  '인물': { node: '#4a90d9', border: '#72b0f0', glow: '#4a90d944', font: '#e8f4ff' },
  '관념': { node: '#8a65d4', border: '#b090f0', glow: '#8a65d444', font: '#f0eaff' },
  '물건': { node: '#c8823a', border: '#e8a860', glow: '#c8823a44', font: '#fff4e4' },
  '종족': { node: '#3aaa7a', border: '#60d0a0', glow: '#3aaa7a44', font: '#e4fff4' },
  '사건': { node: '#c8b040', border: '#e8d060', glow: '#c8b04044', font: '#fffce4' },
};
const DEFAULT_PAL = { node: '#5a6080', border: '#8890b0', glow: '#5a608044', font: '#e4e8ff' };

let network = null;
let allEntries = [];
let selectedEntry = null;
let simMaxChars = 1000;
let isEditMode = false;
let hiddenCats = new Set();

document.addEventListener('DOMContentLoaded', async () => {
  buildLegend();
  await loadSimMaxChars();
  await reloadGraph();
});

async function loadSimMaxChars() {
  try {
    const r = await fetch('/api/settings');
    const s = await r.json();
    simMaxChars = s.max_user_entry_chars ?? 1000;
  } catch(e) {}
}

// ── 범례 (클릭으로 카테고리 토글) ──────────────────────────
function buildLegend() {
  const bar = document.getElementById('legendBar');
  bar.innerHTML = Object.entries(PALETTE).map(([name, p]) => `
    <span class="legend-pill" data-cat="${name}"
      style="background:${p.node}18;color:${p.border};border-color:${p.node}44;"
      onclick="toggleCat('${name}')">
      <span class="legend-dot" style="background:${p.node};"></span>${name}
    </span>
  `).join('');
}

function toggleCat(cat) {
  if (hiddenCats.has(cat)) hiddenCats.delete(cat);
  else hiddenCats.add(cat);
  document.querySelectorAll('.legend-pill').forEach(el => {
    el.classList.toggle('muted', hiddenCats.has(el.dataset.cat));
  });
  reloadGraph();
}

// ── 그래프 로드 ──────────────────────────────────────────
async function reloadGraph() {
  const showInactive = document.getElementById('showInactiveGraph').checked;
  const res = await fetch(`/api/entries?active=${!showInactive}`);
  allEntries = await res.json();

  const visible = allEntries.filter(e => !hiddenCats.has(e.category));
  document.getElementById('emptyHint').style.display = visible.length === 0 ? 'block' : 'none';
  buildGraph(visible);
}

function buildGraph(entries) {
  const container = document.getElementById('networkCanvas');
  const idSet = new Set(entries.map(e => e.id));

  const nodes = new vis.DataSet(entries.map(e => {
    const p = PALETTE[e.category] || DEFAULT_PAL;
    const inactive = !e.is_active;
    return {
      id: e.id,
      label: e.title.length > 15 ? e.title.slice(0, 14) + '…' : e.title,
      title: `[${e.category}] ${e.title}`,
      color: {
        background: inactive ? '#282c3a' : p.node,
        border: inactive ? '#44485a' : p.border,
        highlight: { background: p.node, border: '#ffffff' },
        hover:      { background: p.node, border: p.border },
      },
      font: {
        color: inactive ? '#5a6080' : p.font,
        size: 12,
        face: 'Segoe UI, system-ui, sans-serif',
        vadjust: 0,
      },
      shape: e.image_filename ? 'circularImage' : 'dot',
      image: e.image_filename ? `/storage/${e.image_filename}` : undefined,
      brokenImage: undefined,
      size: e.image_filename ? 28 : (e.created_by === 'user' ? 18 : 13),
      borderWidth: e.image_filename ? 3 : (e.created_by === 'user' ? 2.5 : 1.5),
      shadow: { enabled: !inactive, color: p.glow, size: e.image_filename ? 18 : 12, x: 0, y: 0 },
      opacity: inactive ? 0.45 : 1.0,
      _data: e,
    };
  }));

  const edgeSet = new Set();
  const edges = new vis.DataSet();
  entries.forEach(e => {
    (e.references || []).forEach(refId => {
      if (!idSet.has(refId)) return;
      const key = [Math.min(e.id, refId), Math.max(e.id, refId)].join('-');
      if (!edgeSet.has(key)) {
        edgeSet.add(key);
        edges.add({
          from: e.id, to: refId,
          color: { color: 'rgba(120,130,160,0.25)', highlight: 'rgba(180,190,255,0.7)', hover: 'rgba(160,170,220,0.5)' },
          width: 1.2,
          smooth: { enabled: true, type: 'dynamic', roundness: 0.3 },
          arrows: { to: { enabled: true, scaleFactor: 0.5 } },
        });
      }
    });
  });

  const options = {
    physics: {
      enabled: true,
      solver: 'barnesHut',
      barnesHut: {
        gravitationalConstant: -5000,
        centralGravity: 0.3,
        springLength: 160,
        springConstant: 0.04,
        damping: 0.18,
        avoidOverlap: 0.6,
      },
      stabilization: { enabled: true, iterations: 200, fit: true },
    },
    interaction: {
      hover: true,
      tooltipDelay: 300,
      zoomView: true,
      dragView: true,
      hideEdgesOnDrag: true,
    },
    layout: { improvedLayout: entries.length < 200 },
    nodes: { chosen: false },
    edges: { chosen: false },
  };

  if (network) network.destroy();
  network = new vis.Network(container, { nodes, edges }, options);

  network.on('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
  });

  network.on('click', params => {
    if (params.nodes.length > 0) {
      const entry = entries.find(e => e.id === params.nodes[0]);
      if (entry) showSidePanel(entry);
    } else {
      clearSidePanel();
    }
  });

  // 재로드 후 선택 유지
  if (selectedEntry) {
    const still = entries.find(e => e.id === selectedEntry.id);
    if (still) showSidePanel(still);
  }
}

// ── 사이드 패널 ───────────────────────────────────────────
function showSidePanel(entry) {
  selectedEntry = entry;
  isEditMode = false;

  document.getElementById('sideEmpty').style.display = 'none';
  document.getElementById('sideDetail').style.display = 'block';

  const p = PALETTE[entry.category] || DEFAULT_PAL;
  document.getElementById('sdCategoryBadge').innerHTML =
    `<span style="background:${p.node}22;color:${p.border};border:1px solid ${p.node}44;
      border-radius:12px;padding:2px 10px;font-size:0.72rem;font-weight:600;white-space:nowrap;"
    >${entry.category}</span>`;
  document.getElementById('sdTitle').textContent = entry.title;
  document.getElementById('sdContent').textContent = entry.content || '';

  // 이미지 영역
  renderImageArea(entry);

  // 키워드
  const kwEl = document.getElementById('sdKeywords');
  if (entry.keywords) {
    kwEl.innerHTML = entry.keywords.split(',').map(k => k.trim()).filter(Boolean).map(k =>
      `<span style="background:rgba(106,173,255,0.1);color:#6aadff;border:1px solid rgba(106,173,255,0.25);
        border-radius:12px;padding:2px 9px;font-size:0.7rem;display:inline-block;margin:2px;">${k}</span>`
    ).join('');
  } else {
    kwEl.innerHTML = '<span style="font-size:0.75rem;color:var(--text-muted);">없음</span>';
  }

  document.getElementById('sdTick').textContent =
    entry.tick_created === 0 ? '초기 설정' : `틱 ${entry.tick_created}`;
  document.getElementById('sdStatus').innerHTML = entry.is_active
    ? '<span style="color:#6eeab0;font-size:0.78rem;">● 활성</span>'
    : '<span style="color:#ff7070;font-size:0.78rem;">● 비활성</span>';
  document.getElementById('sdCreatedAt').textContent =
    entry.created_at ? new Date(entry.created_at).toLocaleString('ko-KR') : '';

  // 참조
  const refsDiv = document.getElementById('sdRefs');
  if (entry.references && entry.references.length > 0) {
    refsDiv.innerHTML = entry.references.map(refId => {
      const ref = allEntries.find(e => e.id === refId);
      if (!ref) return `<span style="color:var(--text-muted);font-size:0.75rem;">#${refId}</span>`;
      const rp = PALETTE[ref.category] || DEFAULT_PAL;
      return `<span onclick="jumpToNode(${refId})" style="background:${rp.node}22;color:${rp.border};
        border:1px solid ${rp.node}44;border-radius:12px;padding:2px 9px;font-size:0.72rem;
        cursor:pointer;display:inline-block;">${ref.title}</span>`;
    }).join(' ');
  } else {
    refsDiv.innerHTML = '<span style="font-size:0.75rem;color:var(--text-muted);">없음</span>';
  }

  showConnected(entry.id);
  showViewMode();
  network && network.selectNodes([entry.id]);
  network && network.focus(entry.id, { scale: 1.1, animation: { duration: 350, easingFunction: 'easeInOutQuad' } });
}

// ── 이미지 ───────────────────────────────────────────────
function renderImageArea(entry) {
  const area = document.getElementById('sdImageArea');
  if (entry.image_filename) {
    area.innerHTML = `
      <img src="/storage/${entry.image_filename}" alt="이미지"
        style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;">
      <div class="d-flex gap-2 mt-2">
        <label style="background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;
          padding:3px 10px;font-size:0.75rem;cursor:pointer;flex:1;text-align:center;">
          <i class="bi bi-arrow-repeat me-1"></i>교체
          <input type="file" accept="image/*" style="display:none;" onchange="uploadImageGraph(this)">
        </label>
        <button onclick="deleteImageGraph()"
          style="background:none;border:1px solid rgba(255,112,112,0.3);color:#ff7070;border-radius:6px;
          padding:3px 10px;font-size:0.75rem;cursor:pointer;">
          <i class="bi bi-trash"></i>
        </button>
      </div>`;
  } else {
    area.innerHTML = `
      <label style="display:flex;align-items:center;justify-content:center;gap:8px;
        border:1px dashed var(--border);border-radius:8px;padding:14px;cursor:pointer;
        color:var(--text-muted);font-size:0.78rem;transition:border-color 0.15s;width:100%;"
        onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <i class="bi bi-image" style="font-size:1.1rem;"></i>이미지 추가
        <input type="file" accept="image/*" style="display:none;" onchange="uploadImageGraph(this)">
      </label>`;
  }
}

async function uploadImageGraph(input) {
  if (!selectedEntry || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 5 * 1024 * 1024) { alert('파일 크기는 5MB 이하여야 합니다.'); return; }
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(`/api/entries/${selectedEntry.id}/image`, { method: 'POST', body: fd });
  if (res.ok) {
    const data = await res.json();
    selectedEntry.image_filename = data.image_filename;
    const idx = allEntries.findIndex(e => e.id === selectedEntry.id);
    if (idx >= 0) allEntries[idx].image_filename = data.image_filename;
    renderImageArea(selectedEntry);
    await reloadGraph();
  } else {
    alert('이미지 업로드 실패');
  }
  input.value = '';
}

async function deleteImageGraph() {
  if (!selectedEntry || !confirm('이미지를 삭제하시겠습니까?')) return;
  const res = await fetch(`/api/entries/${selectedEntry.id}/image`, { method: 'DELETE' });
  if (res.ok) {
    selectedEntry.image_filename = null;
    const idx = allEntries.findIndex(e => e.id === selectedEntry.id);
    if (idx >= 0) allEntries[idx].image_filename = null;
    renderImageArea(selectedEntry);
    await reloadGraph();
  }
}

function showConnected(entryId) {
  const refs = (selectedEntry?.references || []);
  const connected = allEntries.filter(e =>
    e.id !== entryId && ((e.references || []).includes(entryId) || refs.includes(e.id))
  );
  const card = document.getElementById('sideConnected');
  const list = document.getElementById('connectedList');

  if (connected.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  document.getElementById('connectedCount').textContent = connected.length;
  list.innerHTML = connected.map(e => {
    const p = PALETTE[e.category] || DEFAULT_PAL;
    return `<div class="connected-item" onclick="jumpToNode(${e.id})">
      <span style="background:${p.node}22;color:${p.border};border:1px solid ${p.node}44;
        border-radius:10px;padding:1px 8px;font-size:0.68rem;white-space:nowrap;flex-shrink:0;">${e.category}</span>
      <span style="font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.title}</span>
    </div>`;
  }).join('');
}

function clearSidePanel() {
  selectedEntry = null;
  document.getElementById('sideEmpty').style.display = 'block';
  document.getElementById('sideDetail').style.display = 'none';
  document.getElementById('sideConnected').style.display = 'none';
}

function jumpToNode(id) {
  const entry = allEntries.find(e => e.id === id);
  if (entry) showSidePanel(entry);
}

// ── 편집 모드 ─────────────────────────────────────────────
function toggleEditMode() { isEditMode ? cancelEditMode() : startEditMode(); }

function startEditMode() {
  isEditMode = true;
  const e = selectedEntry;
  document.getElementById('sdEditTitle').value = e.title;
  document.getElementById('sdEditCategory').value = e.category;
  document.getElementById('sdEditContent').value = e.content;
  document.getElementById('sdEditRefs').value = (e.references || []).join(', ');
  document.getElementById('sdEditActive').checked = e.is_active;
  showEditMode();
  updateSideCharCount();
}

function cancelEditMode() { isEditMode = false; showViewMode(); }

function showViewMode() {
  document.getElementById('viewBlock').style.display = 'block';
  document.getElementById('editBlock').style.display = 'none';
  document.getElementById('editToggleBtn').innerHTML = '<i class="bi bi-pencil"></i>';
}
function showEditMode() {
  document.getElementById('viewBlock').style.display = 'none';
  document.getElementById('editBlock').style.display = 'block';
  document.getElementById('editToggleBtn').innerHTML = '<i class="bi bi-x"></i>';
}

async function saveFromGraph() {
  if (!selectedEntry) return;
  const refs = document.getElementById('sdEditRefs').value
    .split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const body = {
    title: document.getElementById('sdEditTitle').value.trim(),
    category: document.getElementById('sdEditCategory').value,
    content: document.getElementById('sdEditContent').value.trim(),
    references: refs,
    is_active: document.getElementById('sdEditActive').checked,
  };
  if (!body.title || !body.content) { alert('제목과 내용을 입력하세요.'); return; }
  const res = await fetch(`/api/entries/${selectedEntry.id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (res.ok) await reloadGraph();
  else alert('저장 실패');
}

async function deleteFromGraph() {
  if (!selectedEntry || !confirm(`"${selectedEntry.title}" 엔트리를 삭제하시겠습니까?`)) return;
  const res = await fetch(`/api/entries/${selectedEntry.id}`, { method: 'DELETE' });
  if (res.ok) { selectedEntry = null; clearSidePanel(); await reloadGraph(); }
}

// ── 글자수 카운터 ─────────────────────────────────────────
function updateSideCharCount() {
  const ta = document.getElementById('sdEditContent');
  const len = ta.value.length;
  const el = document.getElementById('sdCharCount');
  if (simMaxChars > 0) {
    const over = len - simMaxChars;
    el.innerHTML = over > 0
      ? `<span style="color:#f59e0b;">${len}자 / ${simMaxChars}자 ⚠ ${over}자 초과</span>`
      : `${len}자 / ${simMaxChars}자`;
  } else {
    el.textContent = `${len}자`;
  }
}

// ── MD 제거 ───────────────────────────────────────────────
function stripMarkdown(text) {
  return text
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '$1').replace(/`([^`]+)`/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*\*(.+?)\*\*\*/g, '$1').replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1')
    .replace(/__(.+?)__/g, '$1').replace(/_(.+?)_/g, '$1').replace(/~~(.+?)~~/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
    .replace(/^>\s*/gm, '').replace(/^[\s]*[-*+]\s+/gm, '').replace(/^[\s]*\d+\.\s+/gm, '')
    .replace(/\n{3,}/g, '\n\n').trim();
}
function stripMdSide() {
  const ta = document.getElementById('sdEditContent');
  ta.value = stripMarkdown(ta.value);
  updateSideCharCount();
}
</script>
