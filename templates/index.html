{% extends "base.html" %}
{% block title %}세계관 DB{% endblock %}

{% block content %}
<!-- 스냅샷 저장/불러오기 바 -->
<div class="card mb-4">
  <div class="card-body py-3 px-4">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <span style="color:var(--text-secondary); font-size:0.85rem; font-weight:600;">
        <i class="bi bi-archive me-1"></i>세계관 저장/불러오기
      </span>
      <!-- 저장 -->
      <div class="d-flex gap-2 align-items-center">
        <input type="text" id="snapName" class="form-control form-control-sm"
          style="width:180px;" placeholder="저장 이름 (예: 세계관 1)">
        <input type="text" id="snapDesc" class="form-control form-control-sm"
          style="width:200px;" placeholder="설명 (선택)">
        <button class="btn btn-sm btn-primary" onclick="saveSnapshot()">
          <i class="bi bi-floppy me-1"></i>현재 상태 저장
        </button>
      </div>
      <button class="btn btn-sm btn-outline-secondary" onclick="openSnapshotModal()">
        <i class="bi bi-clock-history me-1"></i>저장 목록 (<span id="snapCount">0</span>)
      </button>
      <!-- 구분선 -->
      <div style="width:1px; height:22px; background:var(--border);"></div>
      <!-- 세계관 백업/복원 -->
      <button class="btn btn-sm btn-outline-secondary" onclick="downloadWorldBackup()" title="현재 세계관 데이터를 JSON으로 다운로드">
        <i class="bi bi-download me-1"></i>세계관 백업
      </button>
      <label class="btn btn-sm btn-outline-secondary mb-0" title="JSON 백업으로 현재 세계관 복원" style="cursor:pointer;">
        <i class="bi bi-upload me-1"></i>세계관 복원
        <input type="file" id="restoreFileInput" accept=".json" style="display:none;" onchange="restoreWorldBackup(this)">
      </label>
      <!-- 구분선 -->
      <div style="width:1px; height:22px; background:var(--border);"></div>
      <!-- 초기화 -->
      <button class="btn btn-sm btn-outline-danger" onclick="resetWorld()">
        <i class="bi bi-trash3 me-1"></i>세계관 초기화
      </button>
    </div>
  </div>
</div>

<div class="row g-4">
  <!-- 왼쪽: 엔트리 목록 -->
  <div class="col-lg-5 col-xl-4">
    <div class="card h-100">
      <div class="card-header d-flex align-items-center justify-content-between py-3">
        <span><i class="bi bi-database me-2"></i>세계관 엔트리</span>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="bulkGenerateKeywords()" id="bulkKwBtn"
            title="키워드 없는 엔트리 전체에 키워드 일괄 생성">
            <i class="bi bi-tags me-1"></i>키워드 일괄
          </button>
          <button class="btn btn-primary btn-sm" onclick="openCreateModal()">
            <i class="bi bi-plus-lg me-1"></i>추가
          </button>
        </div>
      </div>
      <div class="card-body p-3">
        <!-- 필터 -->
        <div class="d-flex gap-2 flex-wrap mb-3">
          <button class="btn btn-sm btn-outline-secondary active" onclick="filterCategory(null, this)">전체</button>
          {% for cat in categories %}
          <button class="btn btn-sm btn-outline-secondary" onclick="filterCategory('{{ cat }}', this)">{{ cat }}</button>
          {% endfor %}
        </div>
        <div class="d-flex gap-2 mb-3">
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="검색..." oninput="filterSearch()">
          <div class="form-check form-switch d-flex align-items-center ms-2" style="white-space:nowrap">
            <input class="form-check-input me-1" type="checkbox" id="showInactive" onchange="loadEntries()">
            <label class="form-check-label small" for="showInactive">비활성 포함</label>
          </div>
        </div>
        <!-- 통계 -->
        <div id="statsBar" class="small text-muted mb-2"></div>
        <!-- 멀티선택 툴바 -->
        <div id="bulkToolbar" style="display:none;" class="d-flex align-items-center gap-2 mb-2 p-2 rounded"
          style="background:rgba(139,127,247,0.08); border:1px solid rgba(139,127,247,0.2);">
          <span class="small" style="color:var(--text-secondary);"><span id="selectedCountBulk">0</span>개 선택됨</span>
          <button class="btn btn-sm btn-outline-secondary" onclick="bulkToggleActive(true)" title="선택 항목 활성화">
            <i class="bi bi-check-circle me-1"></i>활성화
          </button>
          <button class="btn btn-sm btn-outline-secondary" onclick="bulkToggleActive(false)" title="선택 항목 비활성화">
            <i class="bi bi-slash-circle me-1"></i>비활성화
          </button>
          <button class="btn btn-sm btn-outline-danger ms-auto" onclick="bulkDelete()">
            <i class="bi bi-trash me-1"></i>선택 삭제
          </button>
          <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <!-- 목록 -->
        <div id="entryList" style="max-height: calc(100vh - 320px); overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 상세/편집 -->
  <div class="col-lg-7 col-xl-8">
    <div class="card h-100" id="detailPanel">
      <div class="card-body d-flex align-items-center justify-content-center text-muted" id="detailEmpty">
        <div class="text-center">
          <i class="bi bi-cursor-text display-4 mb-3 d-block opacity-25"></i>
          <p>왼쪽에서 엔트리를 선택하거나 새로 추가하세요.</p>
        </div>
      </div>
      <div id="detailContent" style="display:none;" class="p-0 h-100">
        <div class="card-header d-flex align-items-center justify-content-between py-3">
          <div class="d-flex align-items-center gap-2">
            <span id="detailCategoryBadge"></span>
            <span id="detailTitle" class="fw-bold"></span>
            <span id="detailCreatorBadge"></span>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-sm btn-outline-secondary" onclick="startEdit()"><i class="bi bi-pencil me-1"></i>편집</button>
            <button class="btn btn-sm btn-outline-secondary" id="toggleActiveBtn" onclick="toggleActive()"></button>
            <button class="btn btn-sm btn-outline-secondary" onclick="stripMarkdownEntry()" title="**굵게**, # 제목, > 인용 등 마크다운 기호 제거">
              <i class="bi bi-eraser me-1"></i>MD 제거
            </button>
            <button class="btn btn-sm" onclick="translateEntry()"
              style="border:1px solid rgba(139,127,247,0.5); color:var(--accent);">
              <i class="bi bi-translate me-1"></i>영문 번역
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry()"><i class="bi bi-trash me-1"></i>삭제</button>
          </div>
        </div>
        <div class="p-4">
          <!-- 뷰 모드 -->
          <div id="viewMode">
            <!-- 이미지 영역 -->
            <div id="entryImageArea" class="mb-3" style="display:none;">
              <img id="entryImageEl" src="" alt="엔트리 이미지"
                style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">
              <div class="mt-1 d-flex gap-2">
                <label class="btn btn-sm" style="border:1px solid var(--border);color:var(--text-muted);font-size:0.75rem;padding:2px 8px;cursor:pointer;margin:0;">
                  <i class="bi bi-arrow-repeat me-1"></i>교체
                  <input type="file" accept="image/*" style="display:none;" onchange="uploadImage(this)">
                </label>
                <button class="btn btn-sm" onclick="deleteImage()"
                  style="border:1px solid rgba(255,112,112,0.3);color:#ff7070;font-size:0.75rem;padding:2px 8px;">
                  <i class="bi bi-trash me-1"></i>삭제
                </button>
              </div>
            </div>
            <div id="entryImageUploadArea" class="mb-3" style="display:none;">
              <label class="d-flex align-items-center justify-content-center gap-2"
                style="border:1px dashed var(--border);border-radius:8px;padding:16px;cursor:pointer;color:var(--text-muted);font-size:0.8rem;transition:border-color 0.15s;"
                onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
                <i class="bi bi-image" style="font-size:1.2rem;"></i>
                이미지 추가 (jpg/png/gif/webp, 최대 5MB)
                <input type="file" accept="image/*" style="display:none;" onchange="uploadImage(this)">
              </label>
            </div>

            <div class="mb-3">
              <label class="form-label small text-muted">내용</label>
              <div id="detailContentText" style="white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7;"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">
                핵심 키워드
                <button class="btn btn-sm ms-2 py-0" id="kwRefreshBtn"
                  onclick="refreshKeywords()"
                  style="font-size:0.7rem;border:1px solid rgba(106,173,255,0.4);color:#6aadff;padding:1px 6px;">
                  <i class="bi bi-arrow-clockwise me-1"></i>갱신
                </button>
              </label>
              <div id="detailKeywords"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small text-muted">참조 엔트리</label>
              <div id="detailReferences"></div>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small text-muted">생성 틱</label>
                <div id="detailTick" class="small"></div>
              </div>
              <div class="col-6">
                <label class="form-label small text-muted">상태</label>
                <div id="detailStatus" class="small"></div>
              </div>
              <div class="col-12">
                <label class="form-label small text-muted">등록일시</label>
                <div id="detailCreatedAt" class="small text-muted"></div>
              </div>
            </div>

            <!-- 버전 히스토리 -->
            <div id="entryVersionsSection" class="mt-3" style="display:none;">
              <hr style="border-color:var(--border);">
              <div class="d-flex align-items-center gap-2 mb-2">
                <label class="form-label small text-muted mb-0">
                  <i class="bi bi-arrow-left-right me-1" style="color:#ffb86c;"></i>버전 히스토리
                </label>
                <span id="versionCount" class="badge" style="background:rgba(255,184,108,0.2);color:#ffb86c;font-size:0.68rem;"></span>
              </div>
              <div id="entryVersionsList"></div>
            </div>

            <!-- 관련 타임라인 에피소드 -->
            <div id="entryEpisodesSection" class="mt-3" style="display:none;">
              <hr style="border-color:var(--border);">
              <div class="d-flex align-items-center gap-2 mb-2">
                <label class="form-label small text-muted mb-0">
                  <i class="bi bi-clock-history me-1" style="color:var(--accent);"></i>관련 타임라인 에피소드
                </label>
                <span id="episodeCount" class="badge" style="background:rgba(139,127,247,0.2);color:var(--accent);font-size:0.68rem;"></span>
              </div>
              <div id="entryEpisodesList"></div>
            </div>
          </div>
          <!-- 편집 모드 -->
          <div id="editMode" style="display:none;">
            <div class="mb-3">
              <label class="form-label small">제목</label>
              <input type="text" class="form-control" id="editTitle">
            </div>
            <div class="mb-3">
              <label class="form-label small">분류</label>
              <select class="form-select" id="editCategory">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <label class="form-label small mb-0">내용</label>
                <button type="button" class="btn btn-outline-secondary" style="font-size:0.72rem; padding:1px 8px;"
                  onclick="stripMarkdownTextarea('editContent','editCharCount')" title="마크다운 기호 제거">
                  <i class="bi bi-eraser me-1"></i>MD 제거
                </button>
              </div>
              <textarea class="form-control" id="editContent" rows="8" oninput="updateCharCount('editContent','editCharCount')"></textarea>
              <div id="editCharCount" class="small mt-1" style="color: var(--text-secondary)"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small">참조 엔트리 ID (콤마로 구분)</label>
              <input type="text" class="form-control" id="editReferences" placeholder="예: 1, 3, 7">
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="editIsActive">
              <label class="form-check-label small" for="editIsActive">활성 상태</label>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" onclick="saveEdit()"><i class="bi bi-check-lg me-1"></i>저장</button>
              <button class="btn btn-outline-secondary" onclick="cancelEdit()">취소</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 생성 모달 -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>엔트리 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small">제목 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="newTitle" placeholder="예: 아르곤 왕국">
        </div>
        <div class="mb-3">
          <label class="form-label small">분류 <span class="text-danger">*</span></label>
          <select class="form-select" id="newCategory">
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small">내용 <span class="text-danger">*</span></label>
          <textarea class="form-control" id="newContent" rows="6" placeholder="상세한 설명을 입력하세요..." oninput="updateCharCount('newContent','newCharCount')"></textarea>
          <div id="newCharCount" class="small mt-1" style="color: var(--text-secondary)"></div>
        </div>
        <div class="mb-3">
          <label class="form-label small">참조 엔트리 ID (콤마로 구분)</label>
          <input type="text" class="form-control" id="newReferences" placeholder="예: 1, 3, 7">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
        <button class="btn btn-outline-secondary" id="llmGenBtn" onclick="llmGenerateContent()"
          style="border-color:rgba(139,127,247,0.5); color:var(--accent);">
          <i class="bi bi-stars me-1"></i>LLM 생성
        </button>
        <button class="btn btn-primary" onclick="createEntry()"><i class="bi bi-plus-lg me-1"></i>추가</button>
      </div>
    </div>
  </div>
</div>

<!-- 스냅샷 목록 모달 -->
<div class="modal fade" id="snapshotModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>저장된 세계관 목록</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3" id="snapshotListBody">
        <p class="text-muted text-center py-3">저장된 세계관이 없습니다.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<style>
.entry-card.selected {
  border-color: var(--accent) !important;
  background: rgba(139,127,247,0.08) !important;
}
#bulkToolbar {
  background: rgba(139,127,247,0.07);
  border: 1px solid rgba(139,127,247,0.25);
  border-radius: 8px;
}
</style>
<script>
let allEntries = [];
let currentEntry = null;
let currentCategory = null;
let createModal;
let snapshotModal;
let simMaxChars = 1000; // 유저 입력 글자 제한 (마스터 설정)

async function loadSimMaxChars() {
  try {
    const res = await fetch('/api/settings');
    const s = await res.json();
    simMaxChars = s.max_user_entry_chars ?? 1000;
  } catch (e) { /* 무시 */ }
}

function updateCharCount(textareaId, counterId) {
  const ta = document.getElementById(textareaId);
  const counter = document.getElementById(counterId);
  if (!ta || !counter) return;
  const len = ta.value.length;
  const limit = simMaxChars;
  if (limit > 0) {
    const over = len - limit;
    if (over > 0) {
      counter.innerHTML = `<span style="color:#f59e0b">${len}자</span> / 제한: ${limit}자 &nbsp;<span style="color:#f59e0b">⚠ ${over}자 초과분은 LLM에 전달되지 않습니다</span>`;
    } else {
      counter.textContent = `${len}자 / 제한: ${limit}자`;
    }
  } else {
    counter.textContent = `${len}자 (제한 없음)`;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  createModal = new bootstrap.Modal(document.getElementById('createModal'));
  snapshotModal = new bootstrap.Modal(document.getElementById('snapshotModal'));
  loadEntries();
  loadSnapshotCount();
  loadSimMaxChars();
});

// ── 마크다운 제거 ──────────────────────────────
function stripMarkdown(text) {
  return text
    // 코드 블록 (``` ... ```) → 내용만 유지
    .replace(/```[\w]*\n?([\s\S]*?)```/g, '$1')
    // 인라인 코드 (`code`) → 내용만 유지
    .replace(/`([^`]+)`/g, '$1')
    // 헤더 (# ## ### ...) → 텍스트만 유지
    .replace(/^#{1,6}\s+/gm, '')
    // 굵은 기울임 (***text*** 또는 ___text___) → 텍스트만 유지
    .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
    .replace(/___(.+?)___/g, '$1')
    // 굵게 (**text** 또는 __text__) → 텍스트만 유지
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/__(.+?)__/g, '$1')
    // 기울임 (*text* 또는 _text_) → 텍스트만 유지
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/_(.+?)_/g, '$1')
    // 취소선 (~~text~~) → 텍스트만 유지
    .replace(/~~(.+?)~~/g, '$1')
    // 링크 ([text](url)) → 텍스트만 유지
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    // 이미지 (![alt](url)) → alt 텍스트만 유지
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
    // 인용 (> text) → 텍스트만 유지
    .replace(/^>\s*/gm, '')
    // 수평선 (--- / *** / ___) → 제거
    .replace(/^(\s*[-*_]){3,}\s*$/gm, '')
    // 순서없는 목록 기호 (- / * / +) → 제거
    .replace(/^[\s]*[-*+]\s+/gm, '')
    // 순서있는 목록 기호 (1. / 2. ...) → 제거
    .replace(/^[\s]*\d+\.\s+/gm, '')
    // 연속 빈줄 정리 (3줄 이상 → 2줄)
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// 편집 textarea에서 바로 제거
function stripMarkdownTextarea(textareaId, counterId) {
  const ta = document.getElementById(textareaId);
  if (!ta) return;
  ta.value = stripMarkdown(ta.value);
  updateCharCount(textareaId, counterId);
}

// 현재 선택 엔트리를 바로 저장 (헤더 버튼)
async function stripMarkdownEntry() {
  if (!currentEntry) return;
  const stripped = stripMarkdown(currentEntry.content);
  if (stripped === currentEntry.content) {
    alert('제거할 마크다운 기호가 없습니다.');
    return;
  }
  if (!confirm('마크다운 기호를 제거하고 저장합니다.\n\n미리보기:\n' + stripped.slice(0, 200) + (stripped.length > 200 ? '...' : ''))) return;
  const res = await fetch(`/api/entries/${currentEntry.id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: stripped }),
  });
  if (res.ok) {
    await loadEntries();
    selectEntry(currentEntry.id);
  } else {
    alert('저장 실패');
  }
}

// ── 세계관 초기화 ────────────────────────────────
async function resetWorld() {
  const count = allEntries.length;
  if (!confirm(`⚠ 경고: 현재 세계관의 엔트리 ${count}개가 모두 삭제됩니다.\n\n복구하려면 먼저 [DB 백업]으로 저장해 두세요.\n\n정말 초기화하시겠습니까?`)) return;
  if (!confirm('한 번 더 확인합니다. 정말 모든 엔트리를 삭제하시겠습니까?')) return;
  const res = await fetch('/api/entries', { method: 'DELETE' });
  if (res.ok) {
    currentEntry = null;
    document.getElementById('detailContent').style.display = 'none';
    document.getElementById('detailEmpty').style.display = 'flex';
    await loadEntries();
  } else {
    alert('초기화 실패');
  }
}

// ── 세계관 백업 / 복원 ─────────────────────────────
function downloadWorldBackup() {
  // 현재 세계관 ID는 Jinja로 주입
  const wid = {{ current_world.id if current_world else 'null' }};
  if (!wid) { alert('세계관이 선택되지 않았습니다.'); return; }
  window.location.href = `/api/worlds/${wid}/backup`;
}

async function restoreWorldBackup(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const text = await file.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    alert('JSON 파싱 실패: 올바른 백업 파일인지 확인하세요.');
    return;
  }

  if (data.type !== 'world') {
    alert('이 파일은 세계관 백업 파일이 아닙니다.\n전체 DB 복원은 세계관 선택 페이지(/worlds)에서 하세요.');
    return;
  }

  const wid = {{ current_world.id if current_world else 'null' }};
  if (!wid) { alert('세계관이 선택되지 않았습니다.'); return; }

  const entryCount = (data.entries || []).length;
  const worldName = (data.world || {}).name || '알 수 없음';
  if (!confirm(`백업 파일 정보:\n· 세계관: ${worldName}\n· 엔트리: ${entryCount}개\n· 내보낸 시각: ${data.exported_at || '알 수 없음'}\n\n현재 세계관의 데이터를 이 백업으로 교체합니다. 계속하시겠습니까?`)) return;

  const res = await fetch(`/api/worlds/${wid}/restore`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  if (res.ok) {
    const result = await res.json();
    currentEntry = null;
    document.getElementById('detailContent').style.display = 'none';
    document.getElementById('detailEmpty').style.display = 'flex';
    await loadEntries();
    alert(`복원 완료!\n· 엔트리: ${result.entries_restored}개\n· 시뮬레이션 설정: ${result.configs_restored}개`);
  } else {
    alert('복원 실패');
  }
}

async function loadEntries() {
  const activeOnly = !document.getElementById('showInactive').checked;
  const url = `/api/entries?active=${activeOnly}`;
  const res = await fetch(url);
  allEntries = await res.json();
  renderList();
  updateStats();
}

function updateStats() {
  const counts = {};
  allEntries.forEach(e => counts[e.category] = (counts[e.category] || 0) + 1);
  const parts = Object.entries(counts).map(([k, v]) => `${k} ${v}`);
  document.getElementById('statsBar').textContent = `총 ${allEntries.length}개 · ` + parts.join(' · ');
}

function filterCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.btn-outline-secondary.active').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function filterSearch() { renderList(); }

// ── 멀티선택 ──────────────────────────────────
let selectedIds = new Set();

function toggleSelect(id, e) {
  e.stopPropagation();
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateBulkToolbar();
  // 체크박스 시각 업데이트
  const cb = document.querySelector(`.entry-checkbox[data-id="${id}"]`);
  if (cb) cb.checked = selectedIds.has(id);
}

function updateBulkToolbar() {
  const bar = document.getElementById('bulkToolbar');
  const count = selectedIds.size;
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('selectedCountBulk').textContent = count;
}

function clearSelection() {
  selectedIds.clear();
  updateBulkToolbar();
  renderList();
}

async function bulkDelete() {
  if (!selectedIds.size) return;
  if (!confirm(`선택한 ${selectedIds.size}개 엔트리를 삭제합니다. 계속하시겠습니까?`)) return;
  await fetch('/api/entries/bulk-delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ids: [...selectedIds]}),
  });
  if (currentEntry && selectedIds.has(currentEntry.id)) {
    currentEntry = null;
    document.getElementById('detailContent').style.display = 'none';
    document.getElementById('detailEmpty').style.display = 'flex';
  }
  selectedIds.clear();
  await loadEntries();
}

async function bulkToggleActive(isActive) {
  if (!selectedIds.size) return;
  await fetch('/api/entries/bulk-toggle-active', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ids: [...selectedIds], is_active: isActive}),
  });
  selectedIds.clear();
  await loadEntries();
}

function renderList() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let items = allEntries;
  if (currentCategory) items = items.filter(e => e.category === currentCategory);
  if (search) items = items.filter(e =>
    e.title.toLowerCase().includes(search) ||
    e.content.toLowerCase().includes(search) ||
    (e.keywords || '').toLowerCase().includes(search)
  );

  const container = document.getElementById('entryList');
  if (items.length === 0) {
    container.innerHTML = '<p class="text-muted text-center small py-4">엔트리가 없습니다.</p>';
    return;
  }
  container.innerHTML = items.map(e => `
    <div class="entry-card mb-2 ${e.is_active ? '' : 'inactive'} ${selectedIds.has(e.id) ? 'selected' : ''}"
      onclick="selectEntry(${e.id})" style="position:relative;overflow:hidden;">
      ${e.image_filename ? `<img src="/storage/${e.image_filename}" alt=""
        style="width:100%;height:80px;object-fit:cover;border-radius:8px 8px 0 0;margin:-0px;display:block;margin-bottom:8px;opacity:${e.is_active?1:0.4};">` : ''}
      <input type="checkbox" class="entry-checkbox"
        data-id="${e.id}" ${selectedIds.has(e.id) ? 'checked' : ''}
        onclick="toggleSelect(${e.id}, event)"
        style="position:absolute; top:8px; right:8px; width:15px; height:15px; cursor:pointer; accent-color:var(--accent);">
      <div class="d-flex align-items-center gap-2 mb-1" style="padding-right:24px;">
        <span class="category-badge cat-${e.category}">${e.category}</span>
        <span class="entry-title">${escHtml(e.title)}</span>
        <span class="${e.created_by === 'llm' ? 'creator-badge-llm' : 'creator-badge-user'} ms-auto">
          ${e.created_by === 'llm' ? 'LLM' : '유저'}
        </span>
      </div>
      <div class="entry-content">${escHtml(e.content)}</div>
      ${e.keywords ? `<div class="mt-1">${e.keywords.split(',').map(k => k.trim()).filter(Boolean).map(k =>
        `<span class="badge me-1" style="font-size:0.68rem;background:rgba(106,173,255,0.15);color:#6aadff;border:1px solid rgba(106,173,255,0.3);">${escHtml(k)}</span>`
      ).join('')}</div>` : ''}
    </div>
  `).join('');
}

async function selectEntry(id) {
  const res = await fetch(`/api/entries/${id}`);
  currentEntry = await res.json();
  showDetail();
}

function showDetail() {
  const e = currentEntry;
  document.getElementById('detailEmpty').style.display = 'none';
  document.getElementById('detailContent').style.display = 'block';
  document.getElementById('detailTitle').textContent = e.title;
  document.getElementById('detailCategoryBadge').innerHTML = `<span class="category-badge cat-${e.category}">${e.category}</span>`;
  document.getElementById('detailCreatorBadge').innerHTML =
    `<span class="${e.created_by === 'llm' ? 'creator-badge-llm' : 'creator-badge-user'}">${e.created_by === 'llm' ? 'LLM 생성' : '유저 작성'}</span>`;
  document.getElementById('detailContentText').textContent = e.content;
  document.getElementById('detailTick').textContent = e.tick_created === 0 ? '초기 설정' : `틱 ${e.tick_created}`;
  // 버전 노트 배지
  const vNote = e.version_note || '';
  const vNoteHtml = vNote
    ? `<span style="margin-left:6px;font-size:0.68rem;background:rgba(255,184,108,0.15);color:#ffb86c;border:1px solid rgba(255,184,108,0.3);border-radius:8px;padding:1px 7px;">${escHtml(vNote)}</span>`
    : '';
  document.getElementById('detailStatus').innerHTML = (e.is_active
    ? '<span style="color:#6eeab0;">● 활성</span>'
    : '<span style="color:#ff7070;">● 비활성</span>') + vNoteHtml;
  document.getElementById('detailCreatedAt').textContent = new Date(e.created_at).toLocaleString('ko-KR');

  // 버전 히스토리 + 타임라인 에피소드 비동기 로드
  loadEntryVersions(e.id);
  loadEntryEpisodes(e.id);

  // 비활성화/활성화 버튼 텍스트 갱신
  const toggleBtn = document.getElementById('toggleActiveBtn');
  if (e.is_active) {
    toggleBtn.innerHTML = '<i class="bi bi-eye-slash me-1"></i>비활성화';
    toggleBtn.className = 'btn btn-sm btn-outline-secondary';
  } else {
    toggleBtn.innerHTML = '<i class="bi bi-eye me-1"></i>활성화';
    toggleBtn.className = 'btn btn-sm btn-outline-secondary';
    toggleBtn.style.borderColor = '#6eeab0';
    toggleBtn.style.color = '#6eeab0';
  }

  // 이미지 표시
  if (e.image_filename) {
    document.getElementById('entryImageEl').src = `/storage/${e.image_filename}`;
    document.getElementById('entryImageArea').style.display = 'block';
    document.getElementById('entryImageUploadArea').style.display = 'none';
  } else {
    document.getElementById('entryImageArea').style.display = 'none';
    document.getElementById('entryImageUploadArea').style.display = 'block';
  }

  // 키워드 표시
  const kwDiv = document.getElementById('detailKeywords');
  if (e.keywords) {
    const kws = e.keywords.split(',').map(k => k.trim()).filter(Boolean);
    kwDiv.innerHTML = kws.map(k =>
      `<span class="badge me-1" style="font-size:0.75rem;background:rgba(106,173,255,0.15);color:#6aadff;border:1px solid rgba(106,173,255,0.3);">${escHtml(k)}</span>`
    ).join('');
  } else {
    kwDiv.innerHTML = '<span class="text-muted small">없음 (갱신 버튼으로 생성)</span>';
  }

  const refs = e.references || [];
  if (refs.length > 0) {
    const refEntries = refs.map(id => {
      const ref = allEntries.find(x => x.id === id);
      return ref ? `<span class="badge bg-secondary me-1" style="cursor:pointer" onclick="selectEntry(${id})">${ref.title}</span>` : `#${id}`;
    });
    document.getElementById('detailReferences').innerHTML = refEntries.join('');
  } else {
    document.getElementById('detailReferences').innerHTML = '<span class="text-muted small">없음</span>';
  }

  document.getElementById('viewMode').style.display = 'block';
  document.getElementById('editMode').style.display = 'none';
}

function startEdit() {
  const e = currentEntry;
  document.getElementById('editTitle').value = e.title;
  document.getElementById('editCategory').value = e.category;
  document.getElementById('editContent').value = e.content;
  document.getElementById('editReferences').value = (e.references || []).join(', ');
  document.getElementById('editIsActive').checked = e.is_active;
  document.getElementById('viewMode').style.display = 'none';
  document.getElementById('editMode').style.display = 'block';
  updateCharCount('editContent', 'editCharCount');
}

function cancelEdit() {
  document.getElementById('viewMode').style.display = 'block';
  document.getElementById('editMode').style.display = 'none';
}

async function saveEdit() {
  const refs = document.getElementById('editReferences').value
    .split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const body = {
    title: document.getElementById('editTitle').value.trim(),
    category: document.getElementById('editCategory').value,
    content: document.getElementById('editContent').value.trim(),
    references: refs,
    is_active: document.getElementById('editIsActive').checked,
  };
  const res = await fetch(`/api/entries/${currentEntry.id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (res.ok) {
    currentEntry = await res.json();
    await loadEntries();
    showDetail();
  } else {
    alert('저장 실패');

async function loadEntryEpisodes(entryId) {
  const section = document.getElementById('entryEpisodesSection');
  const list = document.getElementById('entryEpisodesList');
  section.style.display = 'none';
  try {
    const res = await fetch(`/api/entries/${entryId}/timeline-events`);
    if (!res.ok) return;
    const events = await res.json();
    if (events.length === 0) return;
    section.style.display = 'block';
    document.getElementById('episodeCount').textContent = events.length + '개';
    list.innerHTML = events.map(ev => `
      <div class="mb-2 p-2 rounded" style="background:rgba(139,127,247,0.06);border:1px solid rgba(139,127,247,0.15);">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span style="font-size:0.68rem;background:rgba(139,127,247,0.2);color:var(--accent);border-radius:8px;padding:1px 7px;">
            ${ev.tick_number === 0 ? '수동' : '틱 ' + ev.tick_number}
          </span>
          <span style="font-size:0.75rem;color:var(--text-muted);">${ev.timeline_name || ''}</span>
          <span style="font-size:0.8rem;font-weight:600;flex:1;">${escHtml(ev.title)}</span>
        </div>
        ${ev.description ? `<div style="font-size:0.75rem;color:var(--text-secondary);white-space:pre-wrap;line-height:1.5;">${escHtml(ev.description.slice(0,180))}${ev.description.length>180?'…':''}</div>` : ''}
      </div>
    `).join('');
  } catch(e) {}
}

async function loadEntryVersions(entryId) {
  const section = document.getElementById('entryVersionsSection');
  const list = document.getElementById('entryVersionsList');
  section.style.display = 'none';
  try {
    const res = await fetch(`/api/entries/${entryId}/versions`);
    if (!res.ok) return;
    const versions = await res.json();
    if (versions.length <= 1) return;  // 버전이 1개뿐이면 숨김
    section.style.display = 'block';
    document.getElementById('versionCount').textContent = versions.length + '개';
    list.innerHTML = versions.map((v, idx) => {
      const isCurrent = v.id === entryId;
      const vNote = v.version_note || (idx === 0 ? '원본' : `버전 ${idx + 1}`);
      const endStyle = v.version_note && v.version_note.includes('소멸') ? 'color:#ff7070;' : '';
      return `
        <div class="mb-1 p-2 rounded d-flex align-items-start gap-2"
          style="background:${isCurrent ? 'rgba(255,184,108,0.1)' : 'rgba(255,255,255,0.02)'};
                 border:1px solid ${isCurrent ? 'rgba(255,184,108,0.35)' : 'var(--border)'};">
          <div style="min-width:60px;">
            <span style="font-size:0.65rem;background:rgba(255,184,108,0.18);color:#ffb86c;border-radius:6px;padding:1px 6px;${endStyle}">
              ${escHtml(vNote)}
            </span>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:0.8rem;font-weight:${isCurrent ? '700' : '400'};color:${isCurrent ? 'var(--text-primary)' : 'var(--text-secondary)'};">
              ${isCurrent ? '▶ ' : ''}${escHtml(v.title)}
              <span style="font-size:0.7rem;color:var(--text-muted);margin-left:4px;">틱${v.tick_created || 0}</span>
            </div>
            <div style="font-size:0.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">
              ${escHtml((v.content || '').slice(0, 80))}${(v.content || '').length > 80 ? '…' : ''}
            </div>
          </div>
          ${!isCurrent ? `<button onclick="jumpToEntry(${v.id})" class="btn btn-sm"
            style="font-size:0.65rem;padding:1px 6px;border:1px solid var(--border);color:var(--text-muted);white-space:nowrap;">보기</button>` : ''}
        </div>`;
    }).join('');
  } catch(e) {}
}

async function jumpToEntry(entryId) {
  const res = await fetch(`/api/entries/${entryId}`);
  if (!res.ok) return;
  currentEntry = await res.json();
  showDetail();
}

async function bulkGenerateKeywords() {
  const btn = document.getElementById('bulkKwBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>생성 중...';
  try {
    const res = await fetch('/api/entries/bulk-keywords', { method: 'POST' });
    const data = await res.json();
    if (res.ok) {
      alert(`키워드 일괄 생성 완료\n성공: ${data.success}개 / 실패: ${data.failed}개 / 전체 대상: ${data.total}개`);
      if (currentEntry) { const r = await fetch(`/api/entries/${currentEntry.id}`); if (r.ok) { currentEntry = await r.json(); showDetail(); } }
      loadEntries();
    } else {
      alert('일괄 생성 실패');
    }
  } catch(e) {
    alert('오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-tags me-1"></i>키워드 일괄 생성';
  }
}

async function refreshKeywords() {
  if (!currentEntry) return;
  const btn = document.getElementById('kwRefreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>생성 중...';
  try {
    const res = await fetch(`/api/entries/${currentEntry.id}/keywords`, { method: 'POST' });
    if (res.ok) {
      const data = await res.json();
      currentEntry.keywords = data.keywords || '';
      // allEntries 캐시도 갱신
      const idx = allEntries.findIndex(e => e.id === currentEntry.id);
      if (idx >= 0) allEntries[idx].keywords = currentEntry.keywords;
      showDetail();
      renderList();
    } else {
      alert('키워드 생성 실패');
    }
  } catch (err) {
    alert('오류: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>갱신';
  }
}

async function uploadImage(input) {
  if (!currentEntry || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 5 * 1024 * 1024) { alert('파일 크기는 5MB 이하여야 합니다.'); return; }
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(`/api/entries/${currentEntry.id}/image`, { method: 'POST', body: fd });
  if (res.ok) {
    const data = await res.json();
    currentEntry.image_filename = data.image_filename;
    const idx = allEntries.findIndex(e => e.id === currentEntry.id);
    if (idx >= 0) allEntries[idx].image_filename = data.image_filename;
    showDetail();
    renderList();
  } else {
    alert('이미지 업로드 실패');
  }
  input.value = '';
}

async function deleteImage() {
  if (!currentEntry || !confirm('이미지를 삭제하시겠습니까?')) return;
  const res = await fetch(`/api/entries/${currentEntry.id}/image`, { method: 'DELETE' });
  if (res.ok) {
    currentEntry.image_filename = null;
    const idx = allEntries.findIndex(e => e.id === currentEntry.id);
    if (idx >= 0) allEntries[idx].image_filename = null;
    showDetail();
    renderList();
  }
}

async function toggleActive() {
  const newState = !currentEntry.is_active;
  const res = await fetch(`/api/entries/${currentEntry.id}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ is_active: newState }),
  });
  if (res.ok) {
    currentEntry = await res.json();
    await loadEntries();
    showDetail();
  }
}

async function deleteEntry() {
  if (!confirm(`'${currentEntry.title}'을 영구 삭제하시겠습니까?\n(비활성화를 원하면 '비활성화' 버튼을 사용하세요)`)) return;
  await fetch(`/api/entries/${currentEntry.id}`, { method: 'DELETE' });
  currentEntry = null;
  document.getElementById('detailEmpty').style.display = 'flex';
  document.getElementById('detailContent').style.display = 'none';
  loadEntries();
}

async function translateEntry() {
  const btn = event.target.closest('button');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>번역 중...';

  try {
    const res = await fetch('/api/translate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ entry_ids: [currentEntry.id] }),
    });
    const data = await res.json();
    if (data.error) { alert('번역 실패: ' + data.error); return; }

    const t = (data.translations || [])[0];
    if (!t) { alert('번역 결과가 없습니다.'); return; }

    // 번역 결과를 새 엔트리로 저장
    const createRes = await fetch('/api/entries', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: t.title_en,
        category: currentEntry.category,
        content: t.content_en,
        references: [currentEntry.id],
      }),
    });
    if (createRes.ok) {
      const newEntry = await createRes.json();
      await loadEntries();
      selectEntry(newEntry.id);
      alert(`영문 번역 엔트리가 생성되었습니다:\n"${t.title_en}"\n\n원본 엔트리(ID:${currentEntry.id})를 참조로 연결했습니다.`);
    }
  } catch(e) {
    alert('오류: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

function openCreateModal() {
  document.getElementById('newTitle').value = '';
  document.getElementById('newContent').value = '';
  document.getElementById('newReferences').value = '';
  updateCharCount('newContent', 'newCharCount');
  createModal.show();
}

// ── LLM 내용 생성 ─────────────────────────────
async function llmGenerateContent() {
  const title = document.getElementById('newTitle').value.trim();
  const category = document.getElementById('newCategory').value;
  if (!title) {
    alert('제목을 먼저 입력하세요.');
    document.getElementById('newTitle').focus();
    return;
  }
  const hint = document.getElementById('newContent').value.trim();
  const refRaw = document.getElementById('newReferences').value;
  const refs = refRaw.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

  const btn = document.getElementById('llmGenBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>생성 중...';

  try {
    const res = await fetch('/api/generate-entry', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, category, hint, references: refs}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '생성 실패');
    document.getElementById('newContent').value = data.content;
    updateCharCount('newContent', 'newCharCount');
  } catch (e) {
    alert('LLM 생성 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-stars me-1"></i>LLM 생성';
  }
}

async function createEntry() {
  const refs = document.getElementById('newReferences').value
    .split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const body = {
    title: document.getElementById('newTitle').value.trim(),
    category: document.getElementById('newCategory').value,
    content: document.getElementById('newContent').value.trim(),
    references: refs,
  };
  if (!body.title || !body.content) { alert('제목과 내용을 입력하세요.'); return; }
  const res = await fetch('/api/entries', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (res.ok) {
    const entry = await res.json();
    createModal.hide();
    await loadEntries();
    selectEntry(entry.id);
  } else {
    const err = await res.json();
    alert(err.error || '생성 실패');
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 스냅샷 ────────────────────────────────

async function loadSnapshotCount() {
  const res = await fetch('/api/snapshots');
  const snaps = await res.json();
  document.getElementById('snapCount').textContent = snaps.length;
}

async function saveSnapshot() {
  const name = document.getElementById('snapName').value.trim();
  if (!name) { alert('저장 이름을 입력하세요.'); return; }
  const desc = document.getElementById('snapDesc').value.trim();

  const res = await fetch('/api/snapshots', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, description: desc }),
  });
  if (res.ok) {
    const snap = await res.json();
    document.getElementById('snapName').value = '';
    document.getElementById('snapDesc').value = '';
    loadSnapshotCount();
    // 간단한 성공 표시
    const btn = event.target.closest('button');
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>저장 완료!';
    btn.style.background = 'rgba(110,234,176,0.2)';
    setTimeout(() => { btn.innerHTML = orig; btn.style.background = ''; }, 2000);
  } else {
    const err = await res.json();
    alert(err.error || '저장 실패');
  }
}

async function openSnapshotModal() {
  snapshotModal.show();
  const res = await fetch('/api/snapshots');
  const snaps = await res.json();
  const body = document.getElementById('snapshotListBody');

  if (snaps.length === 0) {
    body.innerHTML = '<p style="color:var(--text-secondary); text-align:center; padding:2rem;">저장된 세계관이 없습니다.</p>';
    return;
  }
  body.innerHTML = snaps.map(s => `
    <div class="d-flex align-items-center gap-3 p-3 mb-2 rounded"
         style="background:var(--bg-input); border:1px solid var(--border);">
      <div class="flex-grow-1">
        <div class="fw-semibold">${escHtml(s.name)}</div>
        ${s.description ? `<div style="font-size:0.82rem; color:var(--text-secondary);">${escHtml(s.description)}</div>` : ''}
        <div style="font-size:0.78rem; color:var(--text-muted);">
          엔트리 ${s.entry_count}개 · ${new Date(s.created_at).toLocaleString('ko-KR')}
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="restoreSnapshot(${s.id}, '${escHtml(s.name)}')">
          <i class="bi bi-arrow-counterclockwise me-1"></i>불러오기
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteSnapshot(${s.id})">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
  `).join('');
}

async function restoreSnapshot(id, name) {
  if (!confirm(`"${name}" 세계관을 불러오면 현재 DB의 모든 엔트리가 교체됩니다.\n계속하시겠습니까?`)) return;
  const res = await fetch(`/api/snapshots/${id}/restore`, { method: 'POST' });
  if (res.ok) {
    snapshotModal.hide();
    await loadEntries();
    alert(`"${name}" 세계관을 불러왔습니다.`);
  } else {
    alert('불러오기 실패');
  }
}

async function deleteSnapshot(id) {
  if (!confirm('이 저장본을 삭제하시겠습니까?')) return;
  await fetch(`/api/snapshots/${id}`, { method: 'DELETE' });
  await openSnapshotModal();
  loadSnapshotCount();
}
</script>
{% endblock %}
