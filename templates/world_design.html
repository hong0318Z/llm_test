{% extends "base.html" %}
{% block title %}세계관 설계{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-header"><i class="bi bi-magic me-2"></i>단계형 세계관 설계</div><div class="card-body">
<p class="small" style="color:var(--text-secondary)">설계 목록 → 중복 제외 → 분할 상세 생성 → 선택 저장 순서로 작업합니다.</p>
<textarea id="context" class="form-control mb-3" rows="8" placeholder="큰 맥락을 Markdown으로 입력할 수 있습니다."></textarea>
<textarea id="answers" class="form-control mb-3" rows="3" placeholder="보완 질문에 대한 답변 (선택)"></textarea>
<div class="d-flex gap-3 align-items-end flex-wrap mb-3"><div><label class="form-label small mb-1">최대 생성 항목 수</label><input id="targetCount" class="form-control form-control-sm" type="number" value="10" min="1" max="30" style="width:110px"></div><button class="btn btn-primary" id="planBtn" onclick="planStructure()">1. 설계 목록 만들기</button></div><div id="result"></div>
</div></div></div></div>
{% endblock %}
{% block extra_scripts %}<script>
let planned=[], detailed=[]; const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function planStructure(){const btn=planBtn;btn.disabled=true;btn.textContent='중복 확인·설계 중…';try{const r=await fetch('/api/world-design/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:context.value,answers:answers.value,target_count:targetCount.value})});const d=await r.json();if(!r.ok)throw Error(d.error);planned=d.items||[];result.innerHTML=`<h5>설계 요약</h5><p>${esc(d.summary)}</p>${d.questions?.length?`<div class="alert alert-info"><b>추가로 정하면 좋은 점</b><ol class="mb-0">${d.questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}${d.duplicate_matches?.length?`<div class="alert alert-warning"><b>임베딩 유사도 기준 제외</b><ul class="mb-0">${d.duplicate_matches.map(x=>`<li>${esc(x.planned)} → 기존 ${esc(x.existing.join(', '))}</li>`).join('')}</ul></div>`:''}<h5>예정 생성 목록 (${planned.length}개)</h5><div class="list-group mb-3">${planned.map((x,i)=>`<label class="list-group-item"><input class="form-check-input me-2 plannedCheck" type="checkbox" value="${i}" checked><b>[${esc(x.category)}] ${esc(x.title)}</b><div class="small">속성: ${(x.attributes||[]).map(esc).join(' · ')}</div><div class="small text-muted">${esc(x.purpose)}</div></label>`).join('')}</div>${planned.length?`<div class="d-flex align-items-end gap-2"><div><label class="form-label small mb-1">상세 생성 분할 횟수</label><input id="batchCount" class="form-control form-control-sm" type="number" value="5" min="1" max="15" style="width:110px"></div><button class="btn btn-success" onclick="generateDetails(this)">2. 선택 항목 상세 생성</button></div><div class="form-text">예: 10개를 5회로 설정하면 한 번에 2개씩 순차 호출합니다.</div>`:''}`;}catch(e){result.innerHTML=`<div class="alert alert-danger">${esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='1. 설계 목록 만들기'}}
async function generateDetails(btn){const items=[...document.querySelectorAll('.plannedCheck:checked')].map(x=>planned[+x.value]);if(!items.length)return;btn.disabled=true;btn.textContent='분할 상세 생성 중…';try{const r=await fetch('/api/world-design/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:context.value,items,batches:batchCount.value})});const d=await r.json();if(!r.ok)throw Error(d.error);detailed=d.entries||[];result.innerHTML=`<div class="alert alert-success">${d.batches}회로 나눠 생성했습니다. (한 번에 최대 ${d.per_batch}개)</div><h5>상세 DB 미리보기 (${detailed.length}개)</h5><div class="list-group mb-3">${detailed.map((e,i)=>`<label class="list-group-item"><input class="form-check-input me-2 detailCheck" type="checkbox" value="${i}" checked><b>[${esc(e.category)}] ${esc(e.title)}</b><div class="small mt-2" style="white-space:pre-wrap">${esc(e.content)}</div></label>`).join('')}</div><button class="btn btn-success" onclick="applyEntries()">3. 선택 항목 DB에 저장</button>`;}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='2. 선택 항목 상세 생성'}}
async function applyEntries(){const entries=[...document.querySelectorAll('.detailCheck:checked')].map(x=>detailed[+x.value]);if(!entries.length)return;const r=await fetch('/api/world-design/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries})});const d=await r.json();if(!r.ok)return alert(d.error);result.innerHTML=`<div class="alert alert-success">${d.created.length}개 엔트리를 DB에 저장했습니다.</div>`}
</script>{% endblock %}
