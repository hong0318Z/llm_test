<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ part.title if part else chapters[0].title }}{% if world %} · {{ world.name }}{% endif %}</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
:root{--bg:#10121a;--panel:#1a1d28;--line:#303548;--text:#eef2ff;--sub:#aeb8cd;--accent:#9588ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;background:rgba(26,29,40,.96);position:sticky;top:0;z-index:3}.top small{color:var(--sub)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;min-height:calc(100vh - 64px)}.nav,.db{background:var(--panel);padding:18px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}.nav{border-right:1px solid var(--line)}.db{border-left:1px solid var(--line)}button{width:100%;text-align:left;border:1px solid var(--line);background:#131620;color:var(--text);border-radius:8px;padding:10px;margin-bottom:7px;cursor:pointer}button.active,button:hover{border-color:var(--accent)}main{max-width:850px;width:100%;margin:0 auto;padding:44px 54px 100px}.chapter-title{font-size:2rem;margin-bottom:2rem}.markdown{line-height:1.85;font-size:1.04rem}.markdown img{max-width:100%}.markdown blockquote{border-left:3px solid var(--accent);margin-left:0;padding-left:1rem;color:var(--sub)}.markdown pre{background:#090b10;padding:14px;border-radius:8px;overflow:auto}.entity-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#131620}.entity-card img{width:100%;max-height:230px;object-fit:cover;border-radius:7px;margin-bottom:10px}.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:rgba(149,136,255,.16);color:#b9b0ff;font-size:.75rem}.sub{color:var(--sub);font-size:.85rem}.stats{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.stat{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:3px 7px}@media(max-width:950px){.layout{grid-template-columns:1fr}.nav,.db{position:static;height:auto;border:0;border-bottom:1px solid var(--line)}main{padding:30px 22px}.db{border-top:1px solid var(--line)}}
</style></head><body>
<header class="top"><div><strong>{{ part.title if part else '공개 소설' }}</strong>{% if world %}<small> · {{ world.name }}</small>{% endif %}</div></header>
<div class="layout"><aside class="nav">{% if part and part.description %}<div class="markdown" id="partIntro" style="font-size:.82rem;margin-bottom:18px">{{ part.description }}</div>{% endif %}<div class="sub" style="margin-bottom:10px">{% if share_scope=='part' %}이야기/부 목차{% else %}공개 챕터{% endif %}</div><div id="chapterNav"></div></aside><main><h1 class="chapter-title" id="chapterTitle"></h1><article class="markdown" id="chapterBody"></article></main><aside class="db"><div class="sub" style="margin-bottom:10px">이 챕터의 세계관 DB</div><div id="entityList"></div><div id="entityDetail"></div></aside></div>
<script>
const chapters={{ chapters|tojson }};let currentChapter=null;
const safe=s=>DOMPurify.sanitize(marked.parse(String(s||''),{gfm:true,breaks:true}),{FORBID_TAGS:['style','iframe','object','embed','form'],FORBID_ATTR:['style','onerror','onclick','onload']});
{% if part and part.description %}partIntro.innerHTML=safe({{ part.description|tojson }});{% endif %}
function selectChapter(id){currentChapter=chapters.find(c=>c.id===id);if(!currentChapter)return;chapterTitle.textContent=currentChapter.title;chapterBody.innerHTML=safe(currentChapter.content);document.querySelectorAll('#chapterNav button').forEach(b=>b.classList.toggle('active',+b.dataset.id===id));renderEntities()}
function renderEntities(){entityDetail.innerHTML='';const rows=currentChapter.entities||[];entityList.innerHTML=rows.length?rows.map(e=>`<button onclick="showEntity(${e.id})"><span class="badge">${escapeHtml(e.category)}</span> ${escapeHtml(e.title)}</button>`).join(''):'<div class="sub">본문에 연결된 공개 DB 정보가 없습니다.</div>'}
function showEntity(id){const e=(currentChapter.entities||[]).find(x=>x.id===id);if(!e)return;entityList.innerHTML='<button onclick="renderEntities()">← 목록</button>';entityDetail.innerHTML=`<div class="entity-card">${e.image_url?`<img src="${encodeURI(e.image_url)}" alt="">`:''}<span class="badge">${escapeHtml(e.category)}</span><h3>${escapeHtml(e.title)}</h3>${e.primary_year?`<div class="sub">연도: ${escapeHtml(e.primary_year)}</div>`:''}${e.aliases?.length?`<div class="sub">별칭: ${e.aliases.map(escapeHtml).join(', ')}</div>`:''}<div class="stats">${(e.attributes||[]).map(a=>`<span class="stat" title="${escapeHtml(a.description||a.tier_description||'')}">${escapeHtml(a.name)} ${a.value}</span>`).join('')}${(e.skills||[]).map(s=>`<span class="stat">${escapeHtml(s.name)}${s.rank?' '+s.rank:''}</span>`).join('')}</div><div class="markdown">${e.content_visible?safe(e.content):'<span class="sub">아직 공개되지 않은 DB 정보입니다.</span>'}</div></div>`}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
chapterNav.innerHTML=chapters.length?chapters.map((c,i)=>`<button data-id="${c.id}" onclick="selectChapter(${c.id})">${i+1}. ${escapeHtml(c.title)}</button>`).join(''):'<div class="sub">공개된 챕터가 없습니다.</div>';if(chapters.length)selectChapter(chapters[0].id);
</script></body></html>
