{% extends "base.html" %}
{% block title %}소설{% endblock %}
{% block content %}
<style>
.entity-preview{max-height:150px;overflow:auto;white-space:pre-wrap;background:var(--bs-tertiary-bg);font-size:.9rem}
.entity-mark{border-bottom:3px solid var(--entity-color);cursor:pointer;background:color-mix(in srgb,var(--entity-color) 12%,transparent)}
</style>
<div class="row g-3" style="height:calc(100vh - 130px)">
  <div class="col-lg-2"><div class="card h-100"><div class="card-header d-flex justify-content-between">챕터 <button class="btn btn-sm btn-primary" onclick="newChapter()">+</button></div><div id="chapters" class="list-group list-group-flush overflow-auto"></div></div></div>
  <div class="col-lg-7"><div class="card h-100">
    <div class="card-header d-flex gap-2"><input id="chapterTitle" class="form-control" placeholder="챕터 제목"><select id="chapterStatus" class="form-select" style="width:110px"><option>초안</option><option>공개</option></select><button class="btn btn-primary" onclick="saveChapter()">저장</button><button class="btn btn-outline-secondary" onclick="openStyle()">글쓰기 스타일</button></div>
    <div class="card-body d-flex flex-column"><textarea id="chapterContent" class="form-control flex-grow-1" placeholder="Markdown 본문" oninput="renderEntityPreview()"></textarea><div class="small text-muted mt-2">엔티티 강조 미리보기</div><div id="entityPreview" class="entity-preview border rounded p-2"></div><div class="input-group mt-2"><input id="novelInstruction" class="form-control" placeholder="이어쓰기/수정 요청"><button class="btn btn-outline-secondary" onclick="generateNovel()">LLM 제안</button></div><div id="proposal" class="mt-2"></div></div>
  </div></div>
  <div class="col-lg-3"><div class="card h-100"><div class="card-header">인식된 엔티티 <label class="small float-end"><input type="checkbox" id="authorMode" checked onchange="renderEntityPreview()"> 작가 모드</label><div class="mt-2"><button class="btn btn-sm btn-outline-secondary" onclick="llmTag()">LLM 보조 태깅</button> <button class="btn btn-sm btn-outline-primary" onclick="manualTag()">선택문구 수동 태깅</button></div></div><div id="mentions" class="card-body overflow-auto"></div></div></div>
</div>
<div class="modal fade" id="styleModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>글쓰기 스타일</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
  <label>적용 범위</label><select id="styleScope" class="form-select mb-2" onchange="loadStyle()"><option value="world">세계관 기본</option><option value="chapter">현재 챕터 덮어쓰기</option></select><div class="form-text mb-2">챕터에서 비워 둔 항목은 세계관 기본값을 이어받습니다.</div>
  <label>시점</label><input id="stylePov" class="form-control mb-2"><label>톤 가이드</label><textarea id="styleTone" class="form-control mb-2"></textarea><label>금지 표현</label><textarea id="styleForbidden" class="form-control mb-2"></textarea><label>샘플 문체</label><textarea id="styleSample" class="form-control" rows="5"></textarea>
</div><div class="modal-footer"><button class="btn btn-primary" onclick="saveStyle()">저장</button></div></div></div></div>
{% endblock %}
{% block extra_scripts %}<script>
let chapterList=[],current=null,styleModal,proposalText='',entityProposals=[];
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const entityColor=cat=>({'인물':'#e86a92','장소':'#4ea8de','세력':'#9b7ede','종족':'#45b69c','아이템':'#e9a23b','사건':'#e76f51','연도':'#6c8ebf'}[cat]||'#7f8c8d');
async function loadChapters(){chapterList=await(await fetch('/api/novel/chapters')).json();chapters.innerHTML=chapterList.map(c=>`<button draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${c.id}')" ondragover="event.preventDefault()" ondrop="reorder(event,${c.id})" class="list-group-item list-group-item-action ${current?.id===c.id?'active':''}" onclick="selectChapter(${c.id})">${c.order_no}. ${esc(c.title)}<span class="badge bg-secondary float-end">${c.status}</span></button>`).join('')}
async function newChapter(){const r=await fetch('/api/novel/chapters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'새 챕터'})});const c=await r.json();await loadChapters();selectChapter(c.id)}
async function selectChapter(id){current=await(await fetch('/api/novel/chapters/'+id)).json();chapterTitle.value=current.title;chapterContent.value=current.content;chapterStatus.value=current.status;renderMentions();renderEntityPreview();loadChapters()}
async function saveChapter(){if(!current)return;current=await(await fetch('/api/novel/chapters/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:chapterTitle.value,content:chapterContent.value,status:chapterStatus.value})})).json();renderMentions();renderEntityPreview();loadChapters()}
function renderMentions(){mentions.innerHTML=(current?.mentions||[]).map(m=>`<button class="btn btn-sm btn-outline-secondary w-100 text-start mb-1" style="border-left:4px solid ${entityColor(m.category)}" onclick="showEntity(${m.entry_id})"><b>${esc(m.entry_title||m.matched_text)}</b> <small>${esc(m.category)} · ${m.source}</small></button>`).join('')||'<span class="text-muted">저장하면 제목·별칭을 자동 인식합니다.</span>'}
function renderEntityPreview(){const text=chapterContent.value||'',rows=[...(current?.mentions||[])].sort((a,b)=>a.span_start-b.span_start||b.span_end-a.span_end);let pos=0,html='';for(const m of rows){if(m.span_start<pos||m.span_start<0||m.span_end>text.length)continue;html+=esc(text.slice(pos,m.span_start));html+=`<span class="entity-mark" style="--entity-color:${entityColor(m.category)}" title="[${esc(m.category)}] ${esc(m.entry_title)}" onclick="showEntity(${m.entry_id})">${esc(text.slice(m.span_start,m.span_end))}</span>`;pos=m.span_end}html+=esc(text.slice(pos));entityPreview.innerHTML=html||'<span class="text-muted">본문을 저장하면 엔티티가 강조됩니다.</span>'}
function fieldVisible(states,path){if(authorMode.checked)return true;const state=states.find(x=>x.field_path===path)||states.find(x=>path.startsWith(x.field_path+'.'));if(!state||state.visibility==='완전공개')return true;if(state.visibility==='작가전용')return false;const reveal=chapterList.find(c=>c.id===state.reveal_chapter_id);return !!(reveal&&current&&current.order_no>=reveal.order_no)}
async function showEntity(id){const [e,states,stat]=await Promise.all([fetch('/api/entries/'+id).then(r=>r.json()),fetch(`/api/entries/${id}/reveal`).then(r=>r.json()),fetch(`/api/entries/${id}/stat-block`).then(r=>r.json())]);const contentVisible=fieldVisible(states,'content');const attrs=(stat.attributes||[]).filter(a=>fieldVisible(states,'stat_block.'+a.axis_name));const skills=fieldVisible(states,'stat_block.skills')?(stat.skills||[]):[];const statHtml=`<div class="mb-2">${attrs.map(a=>`<span class="badge bg-secondary me-1">${esc(a.axis_name)} ${a.value}${a.label?' · '+esc(a.label):''}</span>`).join('')}</div><div>${skills.map(x=>`<span class="badge text-bg-info me-1">${esc(x.skill.name)}${x.rank?' '+x.rank:''}</span>`).join('')}</div>`;mentions.innerHTML=`<button class="btn btn-sm btn-outline-secondary mb-2" onclick="renderMentions()">← 목록</button><h6>[${esc(e.category)}] ${esc(e.title)}</h6>${statHtml}<div style="white-space:pre-wrap" class="small">${contentVisible?esc(e.content.slice(0,1200)):'<span class="text-warning">이 정보는 현재 챕터에서 공개되지 않았습니다.</span>'}</div><a href="/graph?entry=${e.id}" class="btn btn-sm btn-outline-primary mt-2">관계도에서 보기</a>`}
async function generateNovel(){if(!current)return alert('챕터를 선택하세요.');const r=await fetch('/api/novel/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapter_id:current.id,instruction:novelInstruction.value})});const d=await r.json();if(!r.ok)return alert(d.error);proposalText=d.proposal;entityProposals=d.new_entity_proposals||[];proposal.innerHTML=`<div class="alert alert-info" style="max-height:220px;overflow:auto;white-space:pre-wrap">${esc(proposalText)}</div><button class="btn btn-sm btn-primary" onclick="applyProposal()">본문에 적용</button>${entityProposals.length?` <button class="btn btn-sm btn-outline-warning" onclick="approveEntities()">신규 고유명사 ${entityProposals.length}개 검토·등록</button>`:''}`}
function applyProposal(){chapterContent.value=proposalText;proposal.innerHTML='';renderEntityPreview()}
async function approveEntities(){if(!confirm(entityProposals.map(x=>`[${x.category}] ${x.title}`).join('\n')+'\n\n새 엔트리로 등록할까요?'))return;for(const x of entityProposals){await fetch('/api/entries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:x.title,category:x.category,content:x.content})})}entityProposals=[];alert('승인한 엔트리를 등록했습니다.')}
async function llmTag(){if(!current)return;const r=await fetch(`/api/novel/chapters/${current.id}/mention-proposals`,{method:'POST'});const d=await r.json();if(!r.ok)return alert(d.error);const list=d.mentions||[];if(!list.length)return alert('추가 후보가 없습니다.');if(!confirm(list.map(x=>`${x.matched_text} → 엔트리 #${x.entry_id}`).join('\n')+'\n\n승인할까요?'))return;for(const x of list)await fetch(`/api/novel/chapters/${current.id}/mentions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,source:'llm'})});selectChapter(current.id)}
async function manualTag(){if(!current)return alert('챕터를 선택하세요.');const start=chapterContent.selectionStart,end=chapterContent.selectionEnd,text=chapterContent.value.slice(start,end);if(!text)return alert('본문에서 태깅할 문구를 먼저 선택하세요.');if(chapterContent.value!==current.content){await saveChapter()}const rows=await(await fetch('/api/entries')).json();const entryList=(Array.isArray(rows)?rows:rows.entries||[]);const hint=entryList.slice(0,80).map(e=>`${e.id}: [${e.category}] ${e.title}`).join('\n');const entryId=+(prompt(`'${text}'에 연결할 엔트리 ID\n${hint}`)||0);if(!entryId)return;const r=await fetch(`/api/novel/chapters/${current.id}/mentions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entry_id:entryId,matched_text:text,span_start:start,span_end:end,source:'manual'})});if(!r.ok)return alert((await r.json()).error||'태깅 실패');selectChapter(current.id)}
async function openStyle(){styleScope.value=current?'chapter':'world';styleScope.querySelector('[value="chapter"]').disabled=!current;await loadStyle();styleModal=styleModal||new bootstrap.Modal(document.getElementById('styleModal'));styleModal.show()}
async function loadStyle(){const chapterId=styleScope.value==='chapter'&&current?current.id:null;const s=await(await fetch('/api/novel/style'+(chapterId?'?chapter_id='+chapterId:''))).json();stylePov.value=s.pov;styleTone.value=s.tone_guide;styleForbidden.value=s.forbidden_expressions;styleSample.value=s.sample_text}
async function saveStyle(){const chapterId=styleScope.value==='chapter'&&current?current.id:null;const r=await fetch('/api/novel/style',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({chapter_id:chapterId,pov:stylePov.value,tone_guide:styleTone.value,forbidden_expressions:styleForbidden.value,sample_text:styleSample.value})});if(!r.ok)return alert((await r.json()).error||'저장 실패');styleModal.hide()}
async function reorder(ev,target){const source=+ev.dataTransfer.getData('text/plain');const a=chapterList.find(x=>x.id===source),b=chapterList.find(x=>x.id===target);if(!a||!b)return;const n=a.order_no;a.order_no=b.order_no;b.order_no=n;await Promise.all([a,b].map(x=>fetch('/api/novel/chapters/'+x.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_no:x.order_no})})));loadChapters()}
loadChapters();
</script>{% endblock %}
