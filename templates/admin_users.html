{% extends "base.html" %}{% block title %}사용자 승인{% endblock %}{% block content %}<div class="card"><div class="card-header">사용자 승인 관리</div><div class="table-responsive"><table class="table table-dark table-hover mb-0"><thead><tr><th>이름</th><th>아이디</th><th>상태</th><th></th></tr></thead><tbody>{% for user in users %}<tr><td>{{user.name}}</td><td>{{user.username}}</td><td>{% if user.is_approved %}승인됨{% else %}<span class="text-warning">승인 대기</span>{% endif %}</td><td>{% if not user.is_approved %}<form method="post" action="/admin/users/{{user.id}}/approve"><button class="btn btn-sm btn-primary">승인</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
