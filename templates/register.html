<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorldLLM 회원가입</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-dark text-light"><main class="container" style="max-width:430px;margin-top:12vh"><h2 class="mb-2">회원가입 요청</h2><p class="text-secondary">관리자 승인 후 이용할 수 있습니다.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><input class="form-control mb-2" name="username" placeholder="아이디 (3자 이상)" required><input class="form-control mb-2" name="name" placeholder="이름" required><input class="form-control mb-3" type="password" name="password" placeholder="비밀번호 (6자 이상)" required><button class="btn btn-primary w-100">가입 요청</button></form><a class="d-block mt-3 text-center" href="/login">로그인으로 돌아가기</a></main></body></html>
