{% extends "base.html" %}{% block title %}메타데이터 설정{% endblock %}
{% block content %}
<ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#attrs">능력치 스키마</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#matrix">캐릭터 매트릭스</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#skills">스킬/특성</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#templates">엔트리 템플릿</button></li></ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="attrs"><div class="card"><div class="card-header d-flex justify-content-between">능력치 축 <span><button class="btn btn-sm btn-outline-secondary" id="metadataLlmBtn" onclick="migrateMetadata()"><i class="bi bi-stars me-1"></i>LLM 상세 자동작성</button> <button class="btn btn-sm btn-primary" onclick="addAxis()">행 추가</button></span></div><div class="card-body"><p class="small text-muted">축 설명과 단계별 의미를 직접 편집하거나, LLM이 세계관 및 인물 본문을 근거로 축·수치·상세 설명을 제안하게 할 수 있습니다.</p><div class="table-responsive"><table class="table table-dark" id="attrTable"></table></div><button class="btn btn-primary" onclick="saveAttrs()">저장</button></div></div></div>
<div class="tab-pane fade" id="matrix"><div class="card"><div class="card-body table-responsive"><p class="small text-muted">각 수치의 설명은 해당 인물에게 왜 그 값이 적용됐는지를 기록하며 D&amp;D 시트에도 표시됩니다.</p><table class="table table-dark" id="matrixTable"></table><button class="btn btn-primary" onclick="saveMatrix()">일괄 저장</button></div></div></div>
<div class="tab-pane fade" id="skills"><div class="row g-3"><div class="col-lg-5"><div class="card"><div class="card-header">생성 가이드라인</div><div class="card-body"><label>스킬</label><textarea id="skillGuide" class="form-control mb-2" rows="5"></textarea><label>특성</label><textarea id="traitGuide" class="form-control mb-2" rows="5"></textarea><button class="btn btn-primary" onclick="saveGuide()">저장</button></div></div></div><div class="col-lg-7"><div class="card"><div class="card-header d-flex gap-2"><input id="skillSearch" class="form-control form-control-sm" placeholder="검색/태그" oninput="renderSkills()"><select id="skillTypeFilter" class="form-select form-select-sm" onchange="renderSkills()"><option value="">전체</option><option>스킬</option><option>특성</option></select><select id="skillSort" class="form-select form-select-sm" onchange="renderSkills()"><option value="name">이름순</option><option value="rarity">희귀도순</option></select><button class="btn btn-sm btn-primary" onclick="addSkill()">추가</button></div><div id="skillList" class="card-body"></div></div></div></div></div>
<div class="tab-pane fade" id="templates"><div class="row"><div class="col-3"><div id="templateCats" class="list-group"></div></div><div class="col-9"><div class="card"><div class="card-header d-flex justify-content-between"><span><span id="templateTitle">카테고리</span> <label class="small ms-2"><input id="templateActive" type="checkbox"> 사용</label></span><button class="btn btn-sm btn-primary" onclick="addField()">필드 추가</button></div><div class="card-body"><div id="fieldList"></div><button class="btn btn-primary" onclick="saveTemplate()">템플릿 저장</button></div></div></div></div></div>
</div>{% endblock %}
{% block extra_scripts %}<script>
let meta={},currentTemplate=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){meta=await (await fetch('/api/metadata')).json();skillGuide.value=meta.guideline.skill_generation_guide;traitGuide.value=meta.guideline.trait_generation_guide;renderAttrs();renderMatrix();renderSkills();renderTemplates()}
function renderAttrs(){const top=Math.max(5,...meta.attributes.map(a=>a.max_tier||5));attrTable.innerHTML=`<tr><th>사용</th><th>축 이름 / 설명</th><th>최소</th><th>최대</th>${Array.from({length:top},(_,i)=>`<th>티어 ${i+1}</th>`).join('')}<th></th></tr>`+meta.attributes.map((a,i)=>`<tr draggable="true" data-id="${a.id||''}" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="moveAxis(event,${i})"><td><input class="axis-active" type="checkbox" ${a.is_active?'checked':''}></td><td style="min-width:220px"><input class="form-control axis-name mb-1" value="${esc(a.axis_name)}"><textarea class="form-control axis-description" rows="2" placeholder="판정 용도와 수치의 의미">${esc(a.description||'')}</textarea></td><td><input type="number" class="form-control axis-min" value="${a.min_tier}"></td><td><input type="number" class="form-control axis-max" value="${a.max_tier}"></td>${Array.from({length:top},(_,n)=>`<td style="min-width:110px"><input class="form-control tier-label" data-tier="${n+1}" value="${esc(a.tier_labels?.[String(n+1)]||'')}" ${n+1>a.max_tier?'disabled':''}></td>`).join('')}<td><button class="btn btn-sm btn-danger" onclick="meta.attributes.splice(${i},1);renderAttrs()">삭제</button></td></tr>`).join('')}
function moveAxis(ev,target){const source=+ev.dataTransfer.getData('text/plain');if(source===target)return;const [row]=meta.attributes.splice(source,1);meta.attributes.splice(target,0,row);renderAttrs()}
function addAxis(){meta.attributes.push({axis_name:'새 능력치',description:'',min_tier:1,max_tier:5,tier_labels:{},is_active:true});renderAttrs()}
async function saveAttrs(){const rows=[...attrTable.querySelectorAll('tr')].slice(1);meta.attributes=rows.map(r=>{const labels={};r.querySelectorAll('.tier-label').forEach(x=>{if(x.value)labels[x.dataset.tier]=x.value});return {id:+r.dataset.id||null,is_active:r.querySelector('.axis-active').checked,axis_name:r.querySelector('.axis-name').value,description:r.querySelector('.axis-description').value,min_tier:+r.querySelector('.axis-min').value,max_tier:+r.querySelector('.axis-max').value,tier_labels:labels}});await fetch('/api/metadata/attributes',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({attributes:meta.attributes})});await load()}
function renderMatrix(){const axes=meta.attributes.filter(a=>a.is_active),map=new Map(meta.attribute_values.map(v=>[`${v.entry_id}-${v.axis_id}`,v]));matrixTable.innerHTML='<tr><th>인물</th>'+axes.map(a=>`<th title="${esc(a.description)}">${esc(a.axis_name)}</th>`).join('')+'</tr>'+meta.characters.map(e=>`<tr><th>${esc(e.title)}</th>${axes.map(a=>{const v=map.get(`${e.id}-${a.id}`)||{};return `<td style="min-width:190px"><input class="form-control matrix mb-1" type="number" min="${a.min_tier}" max="${a.max_tier}" data-entry="${e.id}" data-axis="${a.id}" value="${v.value??a.min_tier}"><textarea class="form-control matrix-description" rows="2" placeholder="이 수치의 인물별 근거">${esc(v.description||'')}</textarea></td>`}).join('')}</tr>`).join('')}
async function saveMatrix(){const values=[...document.querySelectorAll('.matrix')].map(x=>({entry_id:+x.dataset.entry,axis_id:+x.dataset.axis,value:+x.value,description:x.parentElement.querySelector('.matrix-description').value}));await fetch('/api/metadata/attribute-values',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});alert('저장했습니다.')}
async function migrateMetadata(){const instruction=prompt('LLM에게 추가로 요청할 기준이 있으면 입력하세요.','D&D 느낌의 수치 체계로, 인물 본문의 설정을 근거로 상세히 작성');if(instruction===null)return;const btn=document.getElementById('metadataLlmBtn');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span>작성 중';try{const r=await fetch('/api/metadata/migration-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction})});const d=await r.json();if(!r.ok)throw Error(d.error||'LLM 요청 실패');const entries=d.entries||[],schemas=d.attribute_schemas||[];const details=entries.reduce((n,e)=>n+Object.keys(e.attributes||{}).length,0);if(!confirm(`능력치 축 ${schemas.length}개, 인물 ${entries.length}명의 상세 수치 ${details}개가 제안되었습니다.\n\n승인하면 메타데이터에 저장합니다. 원문 엔트리는 바뀌지 않습니다.`))return;const apply=await fetch('/api/metadata/migration-apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const saved=await apply.json();if(!apply.ok)throw Error(saved.error||'저장 실패');await load();alert(`${saved.applied||0}개의 인물별 수치와 설명을 저장했습니다.`)}catch(e){alert(e.message)}finally{btn.disabled=false;btn.innerHTML='<i class="bi bi-stars me-1"></i>LLM 상세 자동작성'}}
function renderSkills(){const q=skillSearch.value.toLowerCase(),type=skillTypeFilter.value,sort=skillSort.value;const rows=meta.skills.filter(s=>(!type||s.type===type)&&(s.name+s.description+s.tags.join(' ')).toLowerCase().includes(q)).sort((a,b)=>String(a[sort]||'').localeCompare(String(b[sort]||''),'ko'));skillList.innerHTML=rows.map(s=>`<div class="border-bottom py-2"><b>[${s.type}] ${esc(s.name)}</b> <span class="badge bg-secondary">${esc(s.rarity)}</span><div class="small">${esc(s.description)}</div><div>${s.tags.map(t=>`<span class="badge bg-secondary me-1">${esc(t)}</span>`).join('')}</div><button class="btn btn-sm btn-outline-primary mt-1" onclick="editSkill(${s.id})">수정</button> <button class="btn btn-sm btn-danger mt-1" onclick="deleteSkill(${s.id})">삭제</button></div>`).join('')}
async function addSkill(){const name=prompt('이름');if(!name)return;const type=prompt('유형: 스킬 또는 특성','스킬');const description=prompt('설명','')||'';const tags=(prompt('태그(쉼표)','')||'').split(',').map(x=>x.trim()).filter(Boolean);await fetch('/api/metadata/skills',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,description,tags})});await load()}async function deleteSkill(id){if(confirm('삭제할까요?')){await fetch('/api/metadata/skills/'+id,{method:'DELETE'});await load()}}
async function editSkill(id){const s=meta.skills.find(x=>x.id===id);if(!s)return;const name=prompt('이름',s.name);if(name===null||!name.trim())return;const type=prompt('유형: 스킬 또는 특성',s.type);if(type===null)return;const description=prompt('설명',s.description)||'';const tags=(prompt('태그(쉼표)',s.tags.join(', '))||'').split(',').map(x=>x.trim()).filter(Boolean);const rarity=prompt('희귀도',s.rarity)||'일반';await fetch('/api/metadata/skills/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,type,description,tags,rarity})});await load()}
async function saveGuide(){await fetch('/api/metadata/guideline',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill_generation_guide:skillGuide.value,trait_generation_guide:traitGuide.value})});alert('저장했습니다.')}
function renderTemplates(){templateCats.innerHTML=meta.templates.map((t,i)=>`<button class="list-group-item list-group-item-action" onclick="selectTemplate(${i})">${esc(t.category)}${t.is_active?'':' <small>(꺼짐)</small>'}</button>`).join('');if(meta.templates.length&&!currentTemplate)selectTemplate(0)}function selectTemplate(i){currentTemplate=meta.templates[i];templateTitle.textContent=currentTemplate.category;templateActive.checked=currentTemplate.is_active;renderFields()}function renderFields(){fieldList.innerHTML=currentTemplate.fields.map((f,i)=>`<div class="row g-2 mb-2"><div class="col-4"><input class="form-control fld-name" value="${esc(f.field)}"></div><div class="col-2 form-check"><input class="form-check-input fld-req" type="checkbox" ${f.required?'checked':''}> 필수</div><div class="col-5"><input class="form-control fld-desc" value="${esc(f.description)}"></div><div class="col-1"><button class="btn btn-danger" onclick="currentTemplate.fields.splice(${i},1);renderFields()">×</button></div></div>`).join('')}function addField(){currentTemplate.fields.push({field:'새 필드',required:false,description:''});renderFields()}async function saveTemplate(){currentTemplate.fields=[...fieldList.querySelectorAll('.row')].map(r=>({field:r.querySelector('.fld-name').value,required:r.querySelector('.fld-req').checked,description:r.querySelector('.fld-desc').value}));currentTemplate.is_active=templateActive.checked;await fetch('/api/metadata/templates/'+currentTemplate.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:currentTemplate.fields,is_active:currentTemplate.is_active})});renderTemplates();alert('저장했습니다.')}
load();</script>{% endblock %}
