{% extends "base.html" %}
{% block title %}로그{% endblock %}

{% block content %}
<div class="row g-4">
  <!-- 필터 패널 -->
  <div class="col-lg-3">
    <div class="card">
      <div class="card-header py-3"><i class="bi bi-funnel me-2"></i>필터</div>
      <div class="card-body p-3">
        <div class="mb-3">
          <label class="form-label small">실행 (Run)</label>
          <select class="form-select form-select-sm" id="filterRun" onchange="applyFilter()">
            <option value="">전체</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small">이벤트 유형</label>
          <select class="form-select form-select-sm" id="filterEvent" onchange="applyFilter()">
            <option value="">전체</option>
            <option value="world_event">세계 사건</option>
            <option value="entry_created">엔트리 생성</option>
            <option value="entry_updated">엔트리 수정</option>
            <option value="entry_deactivated">엔트리 소멸</option>
            <option value="context_summary">컨텍스트 요약</option>
            <option value="error">오류</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label small">틱 번호</label>
          <input type="number" class="form-control form-control-sm" id="filterTick" min="0" placeholder="전체" onchange="applyFilter()">
        </div>
        <button class="btn btn-sm btn-outline-secondary w-100" onclick="resetFilter()">
          <i class="bi bi-x-circle me-1"></i>초기화
        </button>
      </div>
    </div>
  </div>

  <!-- 로그 목록 -->
  <div class="col-lg-9">
    <div class="card">
      <div class="card-header py-3 d-flex align-items-center justify-content-between">
        <span><i class="bi bi-journal-text me-2"></i>시뮬레이션 로그</span>
        <div class="d-flex align-items-center gap-2">
          <span id="totalCount" class="small text-muted"></span>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadLogs()" title="새로고침"><i class="bi bi-arrow-clockwise"></i></button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteFilteredLogs()" id="deleteLogsBtn" title="현재 필터 로그 삭제">
            <i class="bi bi-trash me-1"></i>삭제
          </button>
        </div>
      </div>
      <div class="card-body p-3">
        <!-- 범례 -->
        <div class="d-flex gap-3 mb-3 flex-wrap" style="font-size:0.82rem;">
          <span><span style="color:var(--cat-event)">■</span> 세계 사건</span>
          <span><span style="color:var(--cat-race)">■</span> 엔트리 생성</span>
          <span><span style="color:var(--cat-character)">■</span> 엔트리 수정</span>
          <span><span style="color:var(--cat-faction)">■</span> 엔트리 소멸</span>
          <span><span style="color:var(--accent)">■</span> 컨텍스트 요약</span>
        </div>
        <div id="logList"></div>
        <!-- 페이지네이션 -->
        <div class="d-flex justify-content-center gap-2 mt-3" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- 로그 상세 모달 -->
<div class="modal fade" id="logModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-info-circle me-2"></i>로그 상세</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="logModalBody"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let logModal;
let currentPage = 0;
const PAGE_SIZE = 50;

document.addEventListener('DOMContentLoaded', async () => {
  logModal = new bootstrap.Modal(document.getElementById('logModal'));
  await loadRunList();

  // URL 파라미터에서 run_id 처리
  const params = new URLSearchParams(window.location.search);
  const runId = params.get('run_id');
  if (runId) {
    document.getElementById('filterRun').value = runId;
  }
  loadLogs();
});

async function loadRunList() {
  const res = await fetch('/api/runs');
  const runs = await res.json();
  const sel = document.getElementById('filterRun');
  runs.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    const statusLabel = { done: '완료', running: '진행중', error: '오류', pending: '대기' };
    opt.textContent = `Run #${r.id} (${statusLabel[r.status] || r.status}, ${r.total_ticks}틱)`;
    sel.appendChild(opt);
  });
}

async function loadLogs() {
  const runId = document.getElementById('filterRun').value;
  const eventType = document.getElementById('filterEvent').value;
  const tick = document.getElementById('filterTick').value;

  let url = `/api/logs?limit=${PAGE_SIZE}&offset=${currentPage * PAGE_SIZE}`;
  if (runId) url += `&run_id=${runId}`;
  if (eventType) url += `&event_type=${eventType}`;
  if (tick) url += `&tick=${tick}`;

  const res = await fetch(url);
  const data = await res.json();
  renderLogs(data.logs);
  renderPagination(data.total);
  document.getElementById('totalCount').textContent = `총 ${data.total}개`;
}

function applyFilter() {
  currentPage = 0;
  loadLogs();
}

function resetFilter() {
  document.getElementById('filterRun').value = '';
  document.getElementById('filterEvent').value = '';
  document.getElementById('filterTick').value = '';
  currentPage = 0;
  loadLogs();
}

const eventTypeLabels = {
  world_event: '세계 사건',
  entry_created: '엔트리 생성',
  entry_updated: '엔트리 수정',
  entry_deactivated: '엔트리 소멸',
  context_summary: '컨텍스트 요약',
  error: '오류',
};

function renderLogs(logs) {
  const container = document.getElementById('logList');
  if (logs.length === 0) {
    container.innerHTML = '<p class="text-muted text-center py-4">로그가 없습니다.</p>';
    return;
  }
  container.innerHTML = logs.map(l => `
    <div class="log-item log-${l.event_type} d-flex align-items-start gap-2 mb-2" style="border-radius:6px; position:relative;">
      <div style="min-width: 70px; cursor:pointer;" onclick="showLogDetail(${l.id})">
        <span class="log-tick-badge">틱 ${l.tick_number}</span>
      </div>
      <div class="flex-grow-1" style="cursor:pointer;" onclick="showLogDetail(${l.id})">
        <div class="d-flex align-items-center gap-2 mb-1">
          <span class="badge" style="background:rgba(255,255,255,0.08); color:#b0bac8; font-size:0.7rem;">
            ${eventTypeLabels[l.event_type] || l.event_type}
          </span>
          <span class="small text-muted">Run #${l.run_id}</span>
          <span class="small text-muted ms-auto">${new Date(l.created_at).toLocaleString('ko-KR')}</span>
        </div>
        <div class="small">${escHtml(l.description)}</div>
        ${l.llm_reasoning ? `<div class="mt-1" style="font-size:0.78rem;color:var(--text-secondary);font-style:italic;">"${escHtml(l.llm_reasoning.substring(0, 100))}${l.llm_reasoning.length > 100 ? '...' : ''}"</div>` : ''}
        ${l.tokens_total ? `<div class="mt-1" style="font-size:0.72rem;color:var(--accent);">토큰: 입력 ${(l.tokens_in||0).toLocaleString()} · 출력 ${(l.tokens_out||0).toLocaleString()} · 합계 ${l.tokens_total.toLocaleString()}</div>` : ''}
      </div>
      <button class="btn btn-sm" style="padding:1px 6px; border:none; background:transparent; color:var(--text-muted); flex-shrink:0;"
              onclick="deleteSingleLog(${l.id}, this)" title="이 로그 삭제">
        <i class="bi bi-x"></i>
      </button>
    </div>
  `).join('');
}

async function showLogDetail(id) {
  // 전체 로그에서 찾기 (이미 로드됨)
  const runId = document.getElementById('filterRun').value;
  const eventType = document.getElementById('filterEvent').value;
  const tick = document.getElementById('filterTick').value;
  let url = `/api/logs?limit=1000`;
  if (runId) url += `&run_id=${runId}`;
  if (eventType) url += `&event_type=${eventType}`;
  if (tick) url += `&tick=${tick}`;

  // 간단히 모달에 표시 (현재 페이지 데이터에서 찾기)
  // 실제로는 /api/logs/{id} 엔드포인트가 있으면 좋지만 현재 없으므로 재조회
  const res = await fetch(`/api/logs?limit=1&offset=0&run_id=${runId || ''}`);

  // 로그 상세를 위해 해당 run의 모든 로그에서 찾기
  const allRes = await fetch(`/api/logs?limit=500${runId ? '&run_id=' + runId : ''}`);
  const allData = await allRes.json();
  const log = allData.logs.find(l => l.id === id);
  if (!log) return;

  const body = document.getElementById('logModalBody');
  body.innerHTML = `
    <div class="row g-3">
      <div class="col-6">
        <div class="small text-muted">이벤트 유형</div>
        <div class="fw-semibold">${eventTypeLabels[log.event_type] || log.event_type}</div>
      </div>
      <div class="col-3">
        <div class="small text-muted">틱</div>
        <div class="fw-semibold">${log.tick_number}</div>
      </div>
      <div class="col-3">
        <div class="small text-muted">Run ID</div>
        <div class="fw-semibold">#${log.run_id}</div>
      </div>
      <div class="col-12">
        <div class="small text-muted mb-1">설명</div>
        <div style="white-space: pre-wrap;">${escHtml(log.description)}</div>
      </div>
      ${log.llm_reasoning ? `
      <div class="col-12">
        <div class="small text-muted mb-1">LLM 판단 근거</div>
        <div style="white-space: pre-wrap; font-size:0.88rem; color: #b0bac8;">${escHtml(log.llm_reasoning)}</div>
      </div>` : ''}
      ${log.raw_llm_output ? `
      <div class="col-12">
        <div class="small text-muted mb-1">원본 LLM 출력</div>
        <pre class="p-3 rounded small" style="background:var(--bg-input); max-height:300px; overflow-y:auto; white-space: pre-wrap;">${escHtml(log.raw_llm_output)}</pre>
      </div>` : ''}
      <div class="col-12">
        <div class="small text-muted">생성 시각</div>
        <div class="small">${new Date(log.created_at).toLocaleString('ko-KR')}</div>
      </div>
    </div>
  `;
  logModal.show();
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const container = document.getElementById('pagination');
  if (pages <= 1) { container.innerHTML = ''; return; }
  let html = `<button class="btn btn-sm btn-outline-secondary" onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>`;
  const start = Math.max(0, currentPage - 2);
  const end = Math.min(pages - 1, currentPage + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-secondary'}" onclick="goPage(${i})">${i + 1}</button>`;
  }
  html += `<button class="btn btn-sm btn-outline-secondary" onclick="goPage(${currentPage + 1})" ${currentPage >= pages - 1 ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>`;
  container.innerHTML = html;
}

function goPage(page) {
  currentPage = page;
  loadLogs();
  window.scrollTo(0, 0);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function deleteSingleLog(id, btn) {
  btn.disabled = true;
  const res = await fetch(`/api/logs/${id}`, { method: 'DELETE' });
  if (res.ok) {
    btn.closest('.log-item').style.transition = 'opacity 0.2s';
    btn.closest('.log-item').style.opacity = '0';
    setTimeout(() => { loadLogs(); }, 220);
  } else {
    btn.disabled = false;
  }
}

async function deleteFilteredLogs() {
  const runId = document.getElementById('filterRun').value;
  const total = document.getElementById('totalCount').textContent;
  const msg = runId
    ? `Run #${runId}의 모든 로그를 삭제하시겠습니까?`
    : `현재 세계관의 모든 로그(${total})를 삭제하시겠습니까?`;
  if (!confirm(msg)) return;

  const btn = document.getElementById('deleteLogsBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>삭제 중...';

  let url = '/api/logs';
  if (runId) url += `?run_id=${runId}`;
  const res = await fetch(url, { method: 'DELETE' });

  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-trash me-1"></i>삭제';
  if (res.ok) {
    currentPage = 0;
    loadLogs();
  } else {
    alert('삭제 실패');
  }
}
</script>
{% endblock %}
