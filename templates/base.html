<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}세계관 LLM 시스템{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-card: #1a1d27;
      --bg-input: #12151e;
      --accent: #8b7ff7;
      --accent-hover: #7a6ee6;
      --border: #2e3244;
      --text-primary: #f0f4ff;
      --text-secondary: #c8d0e0;
      --text-muted: #8892a4;
      --cat-faction: #ff7070;
      --cat-character: #6aadff;
      --cat-concept: #b07aff;
      --cat-item: #ffb86c;
      --cat-race: #6eeab0;
      --cat-event: #ffe96a;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* Bootstrap text-muted 재정의 */
    .text-muted { color: var(--text-secondary) !important; }
    .small { color: inherit; }

    .navbar {
      background: var(--bg-card) !important;
      border-bottom: 1px solid var(--border);
    }
    .navbar-brand { color: var(--accent) !important; font-weight: 700; letter-spacing: 0.5px; }
    .nav-link { color: var(--text-secondary) !important; }
    .nav-link:hover, .nav-link.active { color: var(--accent) !important; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
    }
    .card-header {
      background: transparent;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-primary);
    }

    .form-control, .form-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .form-control::placeholder { color: var(--text-muted); }
    .form-control:focus, .form-select:focus {
      background: var(--bg-input);
      border-color: var(--accent);
      color: var(--text-primary);
      box-shadow: 0 0 0 3px rgba(139,127,247,0.18);
    }
    .form-select option { background: #1a1d27; color: var(--text-primary); }
    .form-check-input { background-color: var(--bg-input); border-color: var(--border); }
    .form-check-label { color: var(--text-secondary); }
    .form-text { color: var(--text-secondary) !important; }
    .form-label { color: var(--text-secondary); }

    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-outline-secondary { border-color: var(--border); color: var(--text-secondary); }
    .btn-outline-secondary:hover { background: var(--border); color: var(--text-primary); border-color: var(--border); }
    .btn-outline-danger { border-color: #ff6b6b; color: #ff6b6b; }
    .btn-outline-danger:hover { background: rgba(255,107,107,0.15); color: #ff8080; border-color: #ff8080; }

    /* 카테고리 뱃지 */
    .category-badge {
      font-size: 0.72rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; letter-spacing: 0.3px;
    }
    .cat-세력  { background: rgba(255,112,112,0.18); color: var(--cat-faction); }
    .cat-인물  { background: rgba(106,173,255,0.18); color: var(--cat-character); }
    .cat-관념  { background: rgba(176,122,255,0.18); color: var(--cat-concept); }
    .cat-물건  { background: rgba(255,184,108,0.18); color: var(--cat-item); }
    .cat-종족  { background: rgba(110,234,176,0.18); color: var(--cat-race); }
    .cat-사건  { background: rgba(255,233,106,0.18); color: var(--cat-event); }

    /* 작성자 뱃지 */
    .creator-badge-user {
      font-size: 0.68rem; background: rgba(110,234,176,0.15);
      color: #6eeab0; border-radius: 12px; padding: 2px 9px; font-weight: 600;
    }
    .creator-badge-llm {
      font-size: 0.68rem; background: rgba(139,127,247,0.15);
      color: var(--accent); border-radius: 12px; padding: 2px 9px; font-weight: 600;
    }

    /* 엔트리 카드 */
    .entry-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .entry-card:hover { border-color: var(--accent); box-shadow: 0 2px 14px rgba(139,127,247,0.12); }
    .entry-card.inactive { opacity: 0.4; }
    .entry-title { font-weight: 600; font-size: 0.93rem; color: var(--text-primary); }
    .entry-content {
      font-size: 0.82rem; color: var(--text-secondary);
      margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 프롬프트 텍스트에어리어 */
    textarea.prompt-textarea { min-height: 110px; font-size: 0.88rem; }
    .prompt-level-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
    .prompt-l1 { color: #ff8080; }
    .prompt-l2 { color: #ffb86c; }
    .prompt-l3 { color: #6eeab0; }

    /* 로그 아이템 */
    .log-item {
      border-left: 3px solid var(--border);
      padding: 8px 12px; margin-bottom: 6px;
      font-size: 0.84rem; color: var(--text-primary);
      background: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0;
    }
    .log-world_event      { border-color: var(--cat-event); }
    .log-entry_created    { border-color: var(--cat-race); }
    .log-entry_updated    { border-color: var(--cat-character); }
    .log-entry_deactivated{ border-color: var(--cat-faction); }
    .log-context_summary  { border-color: var(--accent); }
    .log-error            { border-color: #ff4444; }
    .log-tick-badge {
      font-size: 0.7rem; background: rgba(255,255,255,0.08);
      color: var(--text-secondary); border-radius: 6px; padding: 1px 7px;
    }

    /* 토큰 표시 */
    .token-stat {
      background: rgba(139,127,247,0.1);
      border: 1px solid rgba(139,127,247,0.25);
      border-radius: 8px; padding: 8px 14px;
      font-size: 0.82rem;
    }
    .token-stat .val { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .token-stat .lbl { color: var(--text-secondary); font-size: 0.75rem; }

    /* 진행 바 */
    .tick-progress { height: 6px; border-radius: 3px; background: var(--border); }
    .tick-progress-bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #c084fc); transition: width 0.4s; }

    /* 모달 */
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); }
    .modal-header { border-bottom: 1px solid var(--border); }
    .modal-footer { border-top: 1px solid var(--border); }
    .modal-title { color: var(--text-primary); }
    .btn-close { filter: invert(1) brightness(0.8); }

    /* pre 블록 */
    pre {
      background: var(--bg-input) !important;
      color: var(--text-secondary) !important;
      border: 1px solid var(--border);
    }

    /* 배지 */
    .badge.bg-secondary { background: rgba(255,255,255,0.1) !important; color: var(--text-secondary); }
    .badge.bg-success   { background: rgba(110,234,176,0.2) !important; color: #6eeab0; }
    .badge.bg-warning   { background: rgba(255,184,108,0.2) !important; color: #ffb86c; }
    .badge.bg-danger    { background: rgba(255,107,107,0.2) !important; color: #ff7070; }

    /* hr */
    hr { border-color: var(--border); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="/"><i class="bi bi-globe2 me-2"></i>WorldLLM</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="bi bi-database me-1"></i>세계관 DB</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/simulation' %}active{% endif %}" href="/simulation"><i class="bi bi-play-circle me-1"></i>시뮬레이션</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs"><i class="bi bi-journal-text me-1"></i>로그</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/export' %}active{% endif %}" href="/export"><i class="bi bi-box-arrow-up me-1"></i>Export</a>
          </li>
          <li class="nav-item ms-2">
            <button class="btn btn-sm" id="llmTestBtn"
              style="border:1px solid var(--border); color:var(--text-secondary); background:transparent;"
              onclick="testLLMConnection()">
              <i class="bi bi-plug me-1"></i>LLM 연결 테스트
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4 py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LLM 연결 테스트 모달 -->
  <div class="modal fade" id="llmTestModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plug me-2"></i>LLM 연결 테스트</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="llmTestBody">
          <div class="text-center py-3" id="llmTestLoading">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div style="color:var(--text-secondary);">연결 확인 중...</div>
          </div>
          <div id="llmTestResult" style="display:none;"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">닫기</button>
          <button class="btn btn-primary" onclick="testLLMConnection()"><i class="bi bi-arrow-clockwise me-1"></i>재시도</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  let llmTestModal;
  document.addEventListener('DOMContentLoaded', () => {
    llmTestModal = new bootstrap.Modal(document.getElementById('llmTestModal'));
  });

  async function testLLMConnection() {
    const btn = document.getElementById('llmTestBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>테스트 중...';

    document.getElementById('llmTestLoading').style.display = 'block';
    document.getElementById('llmTestResult').style.display = 'none';
    llmTestModal.show();

    try {
      const res = await fetch('/api/test-llm', { method: 'POST' });
      const data = await res.json();
      document.getElementById('llmTestLoading').style.display = 'none';
      const el = document.getElementById('llmTestResult');
      el.style.display = 'block';

      if (data.ok) {
        el.innerHTML = `
          <div class="d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background:rgba(110,234,176,0.1); border:1px solid rgba(110,234,176,0.3);">
            <i class="bi bi-check-circle-fill" style="color:#6eeab0; font-size:1.3rem;"></i>
            <span style="color:#6eeab0; font-weight:600;">연결 성공</span>
          </div>
          <div class="mb-2"><span style="color:var(--text-secondary);">모델:</span> <strong>${data.model}</strong></div>
          <div class="mb-2"><span style="color:var(--text-secondary);">응답:</span></div>
          <div class="p-3 rounded mb-2" style="background:var(--bg-input); font-size:0.9rem;">${escHtmlBase(data.reply)}</div>
          ${data.tokens_in != null ? `<div style="font-size:0.8rem;color:var(--accent);">토큰: 입력 ${data.tokens_in} · 출력 ${data.tokens_out}</div>` : ''}
        `;
        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1" style="color:#6eeab0;"></i>연결됨';
        btn.style.borderColor = 'rgba(110,234,176,0.5)';
        btn.style.color = '#6eeab0';
      } else {
        el.innerHTML = `
          <div class="d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background:rgba(255,112,112,0.1); border:1px solid rgba(255,112,112,0.3);">
            <i class="bi bi-x-circle-fill" style="color:#ff7070; font-size:1.3rem;"></i>
            <span style="color:#ff7070; font-weight:600;">연결 실패</span>
          </div>
          <pre class="p-3 rounded" style="font-size:0.82rem; white-space:pre-wrap;">${escHtmlBase(data.error)}</pre>
          <div class="mt-2" style="font-size:0.82rem; color:var(--text-secondary);">
            .env 파일에 GITHUB_TOKEN이 올바르게 설정되어 있는지 확인하세요.
          </div>
        `;
        btn.innerHTML = '<i class="bi bi-x-circle me-1" style="color:#ff7070;"></i>연결 실패';
        btn.style.borderColor = 'rgba(255,112,112,0.5)';
        btn.style.color = '#ff7070';
      }
    } catch (e) {
      document.getElementById('llmTestLoading').style.display = 'none';
      document.getElementById('llmTestResult').style.display = 'block';
      document.getElementById('llmTestResult').innerHTML =
        `<div style="color:#ff7070;">요청 오류: ${e.message}</div>`;
      btn.innerHTML = '<i class="bi bi-x-circle me-1"></i>오류';
    } finally {
      btn.disabled = false;
    }
  }

  function escHtmlBase(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
