{% extends "base.html" %}
{% block title %}아이디어 대화{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-9 col-xl-8">
  <div class="card" style="height:calc(100vh - 150px)">
    <div class="card-header d-flex align-items-center gap-2 flex-wrap"><span><i class="bi bi-chat-dots me-2"></i>세계관 아이디어 대화</span><span class="small" style="color:var(--text-muted)">현재 세계관의 제한된 참조 데이터를 바탕으로 대화합니다.</span><button id="draftBtn" class="btn btn-sm btn-outline-primary ms-auto" onclick="makeEntryDraft(event)" disabled><i class="bi bi-file-earmark-plus me-1"></i>현재 대화로 엔트리 초안</button></div>
    <div class="card-body d-flex flex-column p-3">
      <div class="alert py-2 px-3 small mb-2" style="background:rgba(255,184,108,.08);border-color:rgba(255,184,108,.25);color:var(--text-secondary)"><i class="bi bi-info-circle me-1"></i>이 페이지에 머무는 동안 누적된 전체 대화를 계속 전달합니다. 다른 화면으로 이동하거나 새로고침하면 대화 컨텍스트가 초기화됩니다.</div>
      <div id="messages" class="flex-grow-1 overflow-auto mb-3"></div>
      <form id="chatForm" class="d-flex gap-2"><textarea id="message" class="form-control" rows="2" placeholder="예: 이 세계의 마법 체계에서 갈등을 만들려면? (Shift+Enter로 전송)"></textarea><button class="btn btn-primary" type="submit">보내기</button></form>
    </div>
  </div>
</div></div>

<div class="modal fade" id="entryDraftModal" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title"><i class="bi bi-file-earmark-plus me-2"></i>대화에서 만든 엔트리 초안</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">제목</label><input id="draftTitle" class="form-control"></div><div class="col-md-4"><label class="form-label">분류</label><select id="draftCategory" class="form-select">{% for cat in categories %}<option value="{{ cat }}">{{ cat }}</option>{% endfor %}</select></div><div class="col-lg-6"><label class="form-label">공개 본문 (Markdown)</label><textarea id="draftContent" class="form-control" rows="16" oninput="updateDraftPreview()"></textarea></div><div class="col-lg-6"><label class="form-label">Markdown 미리보기</label><div id="draftPreview" class="markdown-body p-3 rounded" style="min-height:380px;max-height:55vh;overflow:auto;background:var(--bg-input);border:1px solid var(--border)"></div></div><div class="col-12"><label class="form-label text-warning"><i class="bi bi-key me-1"></i>비밀 정보</label><textarea id="draftSecret" class="form-control" rows="4" placeholder="명시적으로 열었을 때만 보이는 내용"></textarea></div></div></div>
  <div class="modal-footer"><span id="draftStatus" class="small me-auto text-muted"></span><button class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button><button id="saveDraftBtn" class="btn btn-primary" onclick="saveEntryDraft()"><i class="bi bi-database-add me-1"></i>DB에 저장</button></div>
</div></div></div>
{% endblock %}
{% block extra_scripts %}<script>
const history=[]; const box=document.getElementById('messages'); let draftModal, draftData={};
document.addEventListener('DOMContentLoaded',()=>{draftModal=new bootstrap.Modal(document.getElementById('entryDraftModal'))});
document.getElementById('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.shiftKey){e.preventDefault();document.getElementById('chatForm').requestSubmit()}});
function add(role,text){const d=document.createElement('div');d.className='p-3 mb-2 rounded';d.style.background=role==='user'?'rgba(139,127,247,.16)':'var(--bg-input)';const label=document.createElement('div');label.className='small fw-semibold mb-2';label.textContent=role==='user'?'나':'LLM';const body=document.createElement('div');renderMarkdown(body,text);d.append(label,body);if(role==='assistant'&&!String(text).startsWith('오류:')){const b=document.createElement('button');b.className='btn btn-sm btn-outline-primary mt-2';b.innerHTML='<i class="bi bi-file-earmark-plus me-1"></i>이 답변으로 엔트리 초안';b.onclick=makeEntryDraft;d.appendChild(b)}box.appendChild(d);box.scrollTop=box.scrollHeight}
document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('message'),message=input.value.trim();if(!message)return;input.value='';add('user',message);const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history})});const d=await r.json();if(!r.ok)throw Error(d.error);history.push({role:'user',content:message},{role:'assistant',content:d.reply});document.getElementById('draftBtn').disabled=false;add('assistant',d.reply)}catch(err){add('assistant','오류: '+err.message)}finally{btn.disabled=false;input.focus()}});
async function makeEntryDraft(evt){if(!history.length)return;const trigger=evt?.currentTarget;const headerBtn=document.getElementById('draftBtn');if(trigger)trigger.disabled=true;headerBtn.disabled=true;try{const r=await fetch('/api/chat/entry-draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history})});const d=await r.json();if(!r.ok)throw Error(d.error);draftData=d;draftTitle.value=d.title||'';draftCategory.value=d.category||'관념';draftContent.value=d.content||'';draftSecret.value=d.secret||'';draftStatus.textContent='저장 전에 내용을 직접 수정할 수 있습니다.';saveDraftBtn.style.display='inline-block';updateDraftPreview();draftModal.show()}catch(e){alert('초안 생성 실패: '+e.message)}finally{if(trigger)trigger.disabled=false;headerBtn.disabled=false}}
function updateDraftPreview(){renderMarkdown('draftPreview',draftContent.value)}
async function saveEntryDraft(){const body={title:draftTitle.value.trim(),category:draftCategory.value,content:draftContent.value.trim(),secret:draftSecret.value,aliases:draftData.aliases||[],attributes:draftData.attributes||{}};if(!body.title||!body.content)return alert('제목과 공개 본문은 필수입니다.');saveDraftBtn.disabled=true;try{const r=await fetch('/api/entries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);draftStatus.innerHTML=`저장했습니다. <a href="/?entry=${d.id}">세계관 DB에서 보기</a>`;saveDraftBtn.style.display='none'}catch(e){draftStatus.textContent='저장 실패: '+e.message}finally{saveDraftBtn.disabled=false}}
</script>{% endblock %}
