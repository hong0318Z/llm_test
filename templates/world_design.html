{% extends "base.html" %}
{% block title %}세계관 설계{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-xl-9"><div class="card"><div class="card-header"><i class="bi bi-magic me-2"></i>큰 맥락으로 세계관 DB 만들기</div><div class="card-body"><p class="small" style="color:var(--text-secondary)">큰 설정을 입력하면 LLM이 부족한 부분을 질문하고, 확정 가능한 세력·장소·인물 등을 초안으로 만듭니다. 저장 전 직접 확인할 수 있습니다.</p><textarea id="context" class="form-control mb-3" rows="8" placeholder="예: 23세기 화성 식민지. 물 부족으로 기업 도시와 독립 정착촌이 대립한다…"></textarea><textarea id="answers" class="form-control mb-3" rows="4" placeholder="LLM의 보완 질문에 대한 답변을 여기에 이어서 입력하세요 (선택)"></textarea><div class="d-flex align-items-center gap-2"><label class="small">연속 생성 횟수</label><input id="rounds" class="form-control form-control-sm" type="number" value="3" min="1" max="5" style="width:75px"><button class="btn btn-primary" id="planBtn" onclick="plan()">설계안 만들기</button></div><div class="form-text">한 묶음당 6~12개 항목을 생성합니다. 로컬 LLM은 3회부터 권장합니다.</div><div id="result" class="mt-4"></div></div></div></div></div>{% endblock %}{% block extra_scripts %}<script>
let proposed=[]; const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function plan(){const btn=document.getElementById('planBtn');const rounds=Math.max(1,Math.min(5,parseInt(document.getElementById('rounds').value)||3));btn.disabled=true;btn.textContent=`${rounds}회 연속 설계 중…`;try{const r=await fetch('/api/world-design/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:context.value,answers:answers.value,rounds})});const d=await r.json();if(!r.ok)throw Error(d.error);proposed=d.entries||[];result.innerHTML=`<h5>이해한 맥락</h5><p>${esc(d.summary)}</p>${d.questions?.length?'<h5>먼저 정하면 좋은 질문</h5><ol>'+d.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ol>':''}<h5>DB 저장 미리보기 (${proposed.length}개 · ${d.batches}회 연속 생성)</h5><div class="list-group mb-3">${proposed.map((e,i)=>`<label class="list-group-item"><input class="form-check-input me-2 entryCheck" type="checkbox" value="${i}" checked><b>[${esc(e.category)}] ${esc(e.title)}</b><div class="small mt-1">${esc(e.content)}</div></label>`).join('')}</div>${proposed.length?'<button class="btn btn-success" onclick="applyEntries()">선택 항목 DB에 저장</button>':''}`;}catch(e){result.innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>'}finally{btn.disabled=false;btn.textContent='설계안 만들기'}}
async function applyEntries(){const selected=[...document.querySelectorAll('.entryCheck:checked')].map(x=>proposed[+x.value]);if(!selected.length)return;const r=await fetch('/api/world-design/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries:selected})});const d=await r.json();if(!r.ok)return alert(d.error);result.innerHTML=`<div class="alert alert-success">${d.created.length}개 엔트리를 DB에 저장했습니다.</div>`}
</script>{% endblock %}
